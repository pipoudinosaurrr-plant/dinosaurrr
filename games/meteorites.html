<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pluie de météorites</title>
  <link rel="stylesheet" href="jeu.css">
  <style>
    html, body { overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="jeu" aria-label="Jeu Pluie de météorites"></canvas>

<script src="../assets/progres.js"></script>
<script>
(() => {
  'use strict';

  const toile = document.getElementById('jeu');
  const ctx = toile.getContext('2d');
  const POLICE = '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif';
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const CLE_RECORD = 'meteorites-record';

  /* ---------- Le vaisseau en pixel art (13 × 12) ---------- */
  const VAISSEAU = [
    '......W......',
    '.....WCW.....',
    '.....WCW.....',
    '....WWCWW....',
    '....WDDDW....',
    '...WWDDDWW...',
    '..R.WDDDW.R..',
    '.RRWWDDDWWRR.',
    'RRRWWWWWWWRRR',
    'RR.WWW.WWW.RR'
  ];
  const FLAMMES = [
    ['....O...O....', '....Y...Y....'],
    ['....Y...Y....', '.....O.O.....']
  ];
  const COULEURS = { W: '#e5e5e5', D: '#6b6b6b', C: '#22c55e', R: '#a3a3a3', O: '#ff8a3a', Y: '#ffd23a' };
  const LARGEUR_GRILLE = 13, HAUTEUR_GRILLE = 12;

  let W = 0, H = 0, s = 4, sol = 0, unite = 1;
  let etoiles = [], relief = [];
  let etat = 'menu';
  let temps = 0, bonus = 0, cristaux = 0, prochainMeteore = 0, prochainCristal = 0;
  let meteores = [], bonusListe = [], particules = [], textes = [];
  let secousse = 0, finDepuis = 0, nouveauRecord = false;
  let record = lireRecord();
  const touches = { gauche: false, droite: false };
  let cible = null;
  const joueur = { x: 0, y: 0, vx: 0, flamme: 0 };

  function lireRecord() {
    try { return Number(localStorage.getItem(CLE_RECORD)) || 0; } catch (e) { return 0; }
  }
  function ecrireRecord(v) {
    try { localStorage.setItem(CLE_RECORD, String(v)); } catch (e) { /* rien */ }
  }

  const largeurJoueur = () => LARGEUR_GRILLE * s;
  const hauteurJoueur = () => HAUTEUR_GRILLE * s;
  const score = () => Math.floor(temps * 10) + bonus;
  const hasard = (a, b) => a + Math.random() * (b - a);
  const tactile = () => window.matchMedia('(hover: none)').matches;

  function redimensionner() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    toile.width = Math.round(W * dpr);
    toile.height = Math.round(H * dpr);
    toile.style.width = W + 'px';
    toile.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    unite = Math.max(0.6, Math.min(H, W * 0.9) / 500);
    s = Math.max(3, Math.min(6, Math.round(H / 125)));
    sol = Math.round(H - Math.max(36, H * 0.1));
    joueur.y = sol - hauteurJoueur() - s * 2;
    if (etat !== 'jeu') joueur.x = W / 2 - largeurJoueur() / 2;
    joueur.x = Math.min(Math.max(0, joueur.x), W - largeurJoueur());

    etoiles = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: Math.random() * W, y: Math.random() * sol, r: Math.random() * 1.3 + 0.3, a: Math.random()
    }));
    relief = [];
    let x = -40;
    while (x < W + 80) {
      relief.push({ x, h: hasard(0.06, 0.16) * H, l: hasard(120, 260) });
      x += hasard(90, 180);
    }
  }

  /* ---------- Démarrer / perdre ---------- */

  function demarrer() {
    etat = 'jeu';
    temps = 0; bonus = 0; cristaux = 0;
    prochainMeteore = 0.6; prochainCristal = hasard(5, 8);
    meteores = []; bonusListe = []; particules = []; textes = [];
    nouveauRecord = false;
    joueur.x = W / 2 - largeurJoueur() / 2;
    joueur.vx = 0;
  }

  function perdre() {
    etat = 'fini';
    if (window.DinoProgres) DinoProgres.fin('meteorites', { score: score() });
    finDepuis = performance.now();
    secousse = 0.4;
    exploser(joueur.x + largeurJoueur() / 2, joueur.y + hauteurJoueur() / 2, 60, ['#ffcf3f', '#ff8a2a', '#e5e5e5', '#737373']);
    if (score() > record) {
      record = score();
      nouveauRecord = true;
      ecrireRecord(record);
    }
  }

  function exploser(x, y, n, couleurs) {
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const v = hasard(60, 340) * unite;
      particules.push({
        x, y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v - 120 * unite,
        vie: hasard(0.4, 1),
        taille: hasard(2, 5) * unite,
        couleur: couleurs[Math.floor(Math.random() * couleurs.length)]
      });
    }
  }

  /* ---------- Mise à jour ---------- */

  function mettreAJour(dt) {
    particules = particules.filter(p => {
      p.vie -= dt;
      p.vy += 600 * unite * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > sol) { p.y = sol; p.vy *= -0.3; p.vx *= 0.6; }
      return p.vie > 0;
    });
    textes = textes.filter(t => { t.vie -= dt; t.y -= 40 * dt; return t.vie > 0; });
    if (secousse > 0) secousse -= dt;
    joueur.flamme += dt * 12;

    if (etat === 'fini') { avancerMeteores(dt, null); return; }
    if (etat !== 'jeu') return;
    temps += dt;

    // le vaisseau
    const vitesseMax = Math.min(W * 0.85, 720);
    let voulu = 0;
    if (touches.gauche !== touches.droite) {
      voulu = touches.gauche ? -vitesseMax : vitesseMax;
    } else if (cible !== null) {
      const ecart = cible - (joueur.x + largeurJoueur() / 2);
      if (Math.abs(ecart) > 4) voulu = Math.max(-vitesseMax, Math.min(vitesseMax, ecart * 9));
    }
    joueur.vx += (voulu - joueur.vx) * Math.min(1, dt * 14);
    joueur.x += joueur.vx * dt;
    joueur.x = Math.min(Math.max(0, joueur.x), W - largeurJoueur());

    // nouvelles météorites, de plus en plus nombreuses
    prochainMeteore -= dt;
    if (prochainMeteore <= 0) {
      prochainMeteore = Math.max(0.2, 0.85 - temps * 0.012) * hasard(0.6, 1.3);
      const vy = Math.min(700, 190 + temps * 7 + hasard(0, 130)) * unite;
      const geante = temps > 20 && Math.random() < 0.12;
      meteores.push({
        x: hasard(0, W + sol * 0.3),
        y: -40,
        vx: -vy * 0.3,
        vy,
        r: (geante ? hasard(24, 32) : hasard(9, 18)) * unite,
        rotation: Math.random() * 6
      });
    }

    // cristaux bonus
    prochainCristal -= dt;
    if (prochainCristal <= 0) {
      prochainCristal = hasard(6, 10);
      bonusListe.push({ x: hasard(30, W - 30), y: -30, vy: 130 * unite, rotation: 0 });
    }

    const zone = {
      x: joueur.x + s * 2,
      y: joueur.y + s,
      w: largeurJoueur() - s * 4,
      h: hauteurJoueur() - s * 3
    };

    avancerMeteores(dt, zone);
    if (etat !== 'jeu') return;

    bonusListe = bonusListe.filter(c => {
      c.y += c.vy * dt;
      c.rotation += dt * 2;
      if (toucheRect(c.x, c.y, 12 * unite, zone)) {
        bonus += 50;
        cristaux++;
        textes.push({ x: c.x, y: c.y - 10, texte: '+50', vie: 1 });
        exploser(c.x, c.y, 16, ['#22c55e', '#86efac', '#ffffff']);
        return false;
      }
      return c.y < sol - 6 * unite;
    });
  }

  // fait tomber les météorites ; zone = vaisseau (null = pas de collision)
  function avancerMeteores(dt, zone) {
    meteores = meteores.filter(m => {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.rotation += dt * 3;
      if (zone && etat === 'jeu' && toucheRect(m.x, m.y, m.r * 0.8, zone)) { perdre(); return false; }
      if (m.y + m.r * 0.4 >= sol) {
        exploser(m.x, sol, 14, ['#ff8a2a', '#ffcf3f', '#525252']);
        return false;
      }
      return m.x > -80;
    });
    if (!zone) bonusListe = bonusListe.filter(c => { c.y += c.vy * dt; return c.y < sol - 6 * unite; });
  }

  function toucheRect(cx, cy, r, rect) {
    const px = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const py = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    return (cx - px) ** 2 + (cy - py) ** 2 < r * r;
  }

  /* ---------- Dessin ---------- */

  function dessinerVaisseau() {
    const lignes = VAISSEAU.concat(FLAMMES[Math.abs(Math.floor(joueur.flamme)) % 2]);
    const x0 = Math.round(joueur.x), y0 = Math.round(joueur.y);
    const inclinaison = Math.max(-0.18, Math.min(0.18, joueur.vx / 2500));
    ctx.save();
    ctx.translate(x0 + largeurJoueur() / 2, y0 + hauteurJoueur() / 2);
    ctx.rotate(inclinaison);
    ctx.translate(-largeurJoueur() / 2, -hauteurJoueur() / 2);
    for (let r = 0; r < lignes.length; r++) {
      for (let c = 0; c < lignes[r].length; c++) {
        const ch = lignes[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = COULEURS[ch];
        ctx.fillRect(c * s, r * s, s, s);
      }
    }
    ctx.restore();
  }

  function dessinerMeteore(m) {
    const angle = Math.atan2(m.vy, m.vx);
    const longueur = m.r * 5;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(angle);
    const traine = ctx.createLinearGradient(-longueur, 0, 0, 0);
    traine.addColorStop(0, 'rgba(255,120,40,0)');
    traine.addColorStop(1, 'rgba(255,170,60,.85)');
    ctx.fillStyle = traine;
    ctx.beginPath();
    ctx.moveTo(-longueur, 0);
    ctx.lineTo(0, -m.r * 0.9);
    ctx.lineTo(0, m.r * 0.9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    const boule = ctx.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
    boule.addColorStop(0, '#fff6b0');
    boule.addColorStop(0.45, '#ffae3a');
    boule.addColorStop(1, '#c2320f');
    ctx.fillStyle = boule;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(120,40,10,.45)';
    ctx.beginPath();
    ctx.arc(m.x + Math.cos(m.rotation) * m.r * 0.4, m.y + Math.sin(m.rotation) * m.r * 0.4, m.r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // ombre d'atterrissage, pour être juste avec le joueur
    if (m.y > sol * 0.35) {
      const xSol = m.x + m.vx * (sol - m.y) / m.vy;
      const force = Math.min(1, (m.y - sol * 0.35) / (sol * 0.6));
      ctx.fillStyle = `rgba(255,60,40,${0.45 * force})`;
      ctx.beginPath();
      ctx.ellipse(xSol, sol + 3, m.r * 1.2, m.r * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function dessinerCristal(c) {
    const r = 12 * unite;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(Math.cos(c.rotation) * 0.35 + 0.75, 1);
    ctx.shadowColor = 'rgba(34,197,94,.9)';
    ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#dcfce7');
    g.addColorStop(0.5, '#4ade80');
    g.addColorStop(1, '#15803d');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.7, -r * 0.2);
    ctx.lineTo(0, r);
    ctx.lineTo(-r * 0.7, -r * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function dessinerDecor() {
    const ciel = ctx.createLinearGradient(0, 0, 0, sol);
    ciel.addColorStop(0, '#000');
    ciel.addColorStop(0.75, '#050505');
    ciel.addColorStop(1, '#0d0d0d');
    ctx.fillStyle = ciel;
    ctx.fillRect(0, 0, W, sol);

    const t = performance.now() / 1000;
    for (const e of etoiles) {
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t * 1.5 + e.a * 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x, e.y, e.r, e.r);
    }
    ctx.globalAlpha = 1;

    // une planète au loin
    const px = W * 0.82, py = sol * 0.28, pr = Math.min(W, H) * 0.09;
    const planete = ctx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
    planete.addColorStop(0, '#3a3a3a');
    planete.addColorStop(1, '#0d0d0d');
    ctx.fillStyle = planete;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(px, py, pr * 1.7, pr * 0.35, -0.3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(0, sol);
    for (const m of relief) {
      ctx.lineTo(m.x, sol);
      ctx.quadraticCurveTo(m.x + m.l / 2, sol - m.h * 2, m.x + m.l, sol);
    }
    ctx.lineTo(W, sol);
    ctx.closePath();
    ctx.fill();

    const terre = ctx.createLinearGradient(0, sol, 0, H);
    terre.addColorStop(0, '#141414');
    terre.addColorStop(0.2, '#0b0b0b');
    terre.addColorStop(1, '#000');
    ctx.fillStyle = terre;
    ctx.fillRect(0, sol, W, H - sol);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, sol, W, Math.max(2, s / 2));
  }

  function texte(contenu, x, y, taille, couleur = '#fff', align = 'center', police = POLICE, graisse = 700) {
    ctx.font = `${graisse} ${taille}px ${police}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = couleur;
    ctx.fillText(contenu, x, y);
  }

  function voile() {
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fillRect(0, 0, W, H);
  }

  function clignoter(contenu, x, y, taille) {
    const a = 0.55 + 0.45 * Math.sin(performance.now() / 260);
    texte(contenu, x, y, taille, `rgba(74,222,128,${a.toFixed(2)})`, 'center', MONO, 500);
  }

  function dessiner() {
    ctx.save();
    if (secousse > 0) ctx.translate(hasard(-6, 6), hasard(-6, 6));
    dessinerDecor();
    bonusListe.forEach(dessinerCristal);
    meteores.forEach(dessinerMeteore);
    if (etat !== 'fini') dessinerVaisseau();
    for (const p of particules) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.vie * 1.5));
      ctx.fillStyle = p.couleur;
      ctx.fillRect(p.x, p.y, p.taille, p.taille);
    }
    ctx.globalAlpha = 1;
    for (const t of textes) {
      ctx.globalAlpha = Math.min(1, t.vie * 2);
      texte(t.texte, t.x, t.y, 18, '#4ade80', 'center', MONO, 700);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    const marge = 16;
    const petit = Math.max(14, Math.round(16 * unite));
    if (etat === 'jeu' || etat === 'pause') {
      texte('SCORE ' + String(score()).padStart(5, '0'), marge, 22, 13, '#fff', 'left', MONO, 500);
      texte('CRISTAUX ' + cristaux, marge, 42, 12, '#4ade80', 'left', MONO, 500);
    }
    texte('RECORD ' + String(record).padStart(5, '0'), W - marge, 22, 13, '#6b6b6b', 'right', MONO, 500);

    const cx = W / 2;
    const cy = sol * 0.42;
    if (etat === 'menu') {
      voile();
      texte('PLUIE DE MÉTÉORITES', cx, cy - 64, 11, '#6b6b6b', 'center', MONO, 500);
      texte('Esquive. Survis.', cx, cy - 30, Math.min(40, W / 12), '#fff', 'center', POLICE, 800);
      texte('Les cristaux verts rapportent 50 points.', cx, cy + 10, petit, '#a1a1a1', 'center', POLICE, 400);
      texte(tactile() ? 'Glisse ton doigt pour bouger' : '← → ou Q / D pour bouger', cx, cy + 34, petit, '#6b6b6b', 'center', POLICE, 400);
      clignoter(tactile() ? 'TOUCHE POUR COMMENCER' : 'ESPACE POUR COMMENCER', cx, cy + 76, 12);
    } else if (etat === 'pause') {
      voile();
      texte('Pause', cx, cy, 38, '#fff', 'center', POLICE, 800);
      clignoter('CLIQUE OU ESPACE POUR REPRENDRE', cx, cy + 44, 12);
    } else if (etat === 'fini') {
      voile();
      texte('PARTIE TERMINÉE', cx, cy - 66, 11, '#6b6b6b', 'center', MONO, 500);
      texte(String(score()), cx, cy - 24, Math.min(64, W / 7), '#fff', 'center', MONO, 700);
      if (nouveauRecord) texte('Nouveau record', cx, cy + 22, petit, '#4ade80', 'center', POLICE, 600);
      else texte('Record : ' + record, cx, cy + 22, petit, '#a1a1a1', 'center', POLICE, 400);
      if (performance.now() - finDepuis > 700) {
        clignoter(tactile() ? 'TOUCHE POUR REJOUER' : 'ESPACE POUR REJOUER', cx, cy + 66, 12);
      }
    }
  }

  /* ---------- Contrôles ---------- */

  function action() {
    if (etat === 'menu') demarrer();
    else if (etat === 'pause') etat = 'jeu';
    else if (etat === 'fini' && performance.now() - finDepuis > 700) demarrer();
  }

  window.addEventListener('keydown', e => {
    const k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA' || k === 'KeyQ') { touches.gauche = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'KeyD') { touches.droite = true; e.preventDefault(); }
    if (k === 'Space' || k === 'Enter') { e.preventDefault(); action(); }
    if (k === 'KeyP' || k === 'Escape') { if (etat === 'jeu') etat = 'pause'; }
  });
  window.addEventListener('keyup', e => {
    const k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA' || k === 'KeyQ') touches.gauche = false;
    if (k === 'ArrowRight' || k === 'KeyD') touches.droite = false;
  });

  toile.addEventListener('pointerdown', e => {
    window.focus();
    if (etat !== 'jeu') { action(); return; }
    cible = e.clientX;
    toile.setPointerCapture(e.pointerId);
  });
  toile.addEventListener('pointermove', e => { if (cible !== null) cible = e.clientX; });
  const lacher = () => { cible = null; };
  toile.addEventListener('pointerup', lacher);
  toile.addEventListener('pointercancel', lacher);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && etat === 'jeu') etat = 'pause';
  });
  window.addEventListener('blur', () => { touches.gauche = touches.droite = false; });

  /* ---------- Boucle ---------- */

  let avant = performance.now();
  function boucle(maintenant) {
    const dt = Math.max(0, Math.min(0.05, (maintenant - avant) / 1000));
    avant = maintenant;
    mettreAJour(dt);
    dessiner();
    requestAnimationFrame(boucle);
  }

  window.addEventListener('resize', redimensionner);
  redimensionner();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
