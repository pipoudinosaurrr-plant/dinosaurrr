<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dessine et devine</title>
  <link rel="stylesheet" href="jeu.css">
  <link rel="stylesheet" href="multi/salon.css">
  <style>
    #jeu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 52px 12px 12px; overflow-y: auto; }
    #jeu[hidden] { display: none; }
    .haut { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: var(--l); }
    .mot { flex: 1; color: #fff; font: 700 clamp(18px, 4vw, 26px) var(--mono); letter-spacing: .18em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mot small { display: block; color: var(--tres-doux); font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; }

    .milieu { display: flex; gap: 12px; align-items: flex-start; }
    .tableau-zone { position: relative; width: var(--l); }
    #tableau { display: block; width: 100%; aspect-ratio: 10 / 7; border-radius: 12px; background: #fff; touch-action: none; }
    .dessine #tableau { cursor: crosshair; }
    .voile { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; border-radius: 12px; background: rgba(0, 0, 0, .78); color: #fff; text-align: center; }
    .voile[hidden] { display: none; }
    .voile h2 { margin: 0; font: 800 clamp(20px, 4vw, 28px) var(--police); }
    .voile .mots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .voile .mots button { height: 46px; padding: 0 18px; border: 1px solid #fafafa; border-radius: 12px; background: #fafafa; color: #000; font: 700 16px var(--police); cursor: pointer; }
    .voile p { margin: 0; color: var(--doux); }

    .joueurs-jeu { display: grid; gap: 6px; width: 190px; }
    .joueurs-jeu div { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--bord); border-radius: 10px; background: rgba(255, 255, 255, .02); font-size: 13px; }
    .joueurs-jeu div.trouve { border-color: rgba(34, 197, 94, .5); background: rgba(34, 197, 94, .1); }
    .joueurs-jeu i { flex: none; width: 9px; height: 9px; border-radius: 3px; }
    .joueurs-jeu span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .joueurs-jeu b { font: 600 12px var(--mono); }

    .outils, .devine { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; width: var(--l); }
    .outils[hidden], .devine[hidden] { display: none; }
    .couleurs { display: flex; flex-wrap: wrap; gap: 5px; }
    .couleurs button { width: 28px; height: 28px; padding: 0; border: 2px solid #333; border-radius: 50%; cursor: pointer; }
    .couleurs button.actif { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
    .tailles { display: flex; gap: 4px; }
    .tailles button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--bord2); border-radius: 9px; background: #111; cursor: pointer; }
    .tailles button.actif { border-color: #fff; }
    .tailles i { display: block; border-radius: 50%; background: #fff; }
    .devine input { flex: 1; min-width: 0; }
    .retour { width: var(--l); min-height: 18px; color: var(--doux); font-size: 13px; text-align: center; }

    @media (max-width: 760px) {
      .milieu { flex-direction: column; align-items: center; }
      .joueurs-jeu { display: flex; flex-wrap: wrap; justify-content: center; width: var(--l); }
      .joueurs-jeu div { height: 30px; }
    }
  </style>
</head>
<body>
  <main id="jeu" hidden>
    <div class="haut"><span class="pilule" id="tour">Tour</span><div class="mot" id="mot"></div><span class="pilule" id="chrono">—</span></div>
    <div class="milieu">
      <div class="tableau-zone">
        <canvas id="tableau" width="1000" height="700"></canvas>
        <div class="voile" id="voile" hidden></div>
      </div>
      <div class="joueurs-jeu" id="joueurs"></div>
    </div>
    <div class="outils" id="outils" hidden>
      <div class="couleurs" id="couleurs"></div>
      <div class="tailles" id="tailles"></div>
      <button class="btn petit" id="gomme">Gomme</button>
      <button class="btn petit" id="effacer">Tout effacer</button>
    </div>
    <form class="devine" id="devine" hidden autocomplete="off">
      <input type="text" id="essai" maxlength="40" placeholder="Ta proposition…" aria-label="Ta proposition">
      <button class="btn primaire" type="submit">Proposer</button>
    </form>
    <div class="retour" id="retour"></div>
  </main>

  <script src="../assets/config.js"></script>
  <script type="module">
    import { demarrerJeu, echapper, TACTILE } from './multi/salon.js';
    import moteur from './multi/jeux/dessin.js';

    const COULEURS = ['#111111', '#9ca3af', '#ffffff', '#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#92400e'];
    const TAILLES = [4, 10, 22];
    const jeu = document.getElementById('jeu');
    const tableau = document.getElementById('tableau');
    const g2 = tableau.getContext('2d');
    let vue = null, ctxJeu = null, finLocale = 0, duree = 75000;
    let couleur = '#111111', epaisseur = 10, avantGomme = null;
    let trace = null, enAttente = [], dernierEnvoi = 0, premierEnvoi = false;

    function dimension() {
      const large = innerWidth > 760;
      const l = Math.min(innerWidth - (large ? 230 : 24), (innerHeight - (large ? 200 : 300)) * 10 / 7, 900);
      jeu.style.setProperty('--l', Math.max(260, Math.floor(l)) + 'px');
    }
    addEventListener('resize', dimension);

    function effacer() { g2.fillStyle = '#fff'; g2.fillRect(0, 0, 1000, 700); }
    function dessinerTrait(p, c, w) {
      g2.strokeStyle = c;
      g2.fillStyle = c;
      g2.lineWidth = w;
      g2.lineCap = 'round';
      g2.lineJoin = 'round';
      if (p.length === 2) { g2.beginPath(); g2.arc(p[0], p[1], w / 2, 0, Math.PI * 2); g2.fill(); return; }
      g2.beginPath();
      g2.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length; i += 2) g2.lineTo(p[i], p[i + 1]);
      g2.stroke();
    }

    // outils du dessinateur
    document.getElementById('couleurs').innerHTML = COULEURS.map(c => `<button style="background:${c}" data-c="${c}" aria-label="Couleur ${c}"></button>`).join('');
    document.getElementById('tailles').innerHTML = TAILLES.map(t => `<button data-t="${t}" aria-label="Taille ${t}"><i style="width:${4 + t / 2}px;height:${4 + t / 2}px"></i></button>`).join('');
    function majOutils() {
      document.querySelectorAll('#couleurs button').forEach(b => b.classList.toggle('actif', b.dataset.c === couleur));
      document.querySelectorAll('#tailles button').forEach(b => b.classList.toggle('actif', Number(b.dataset.t) === epaisseur));
    }
    majOutils();
    document.getElementById('couleurs').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { couleur = b.dataset.c; avantGomme = null; majOutils(); } });
    document.getElementById('tailles').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { epaisseur = Number(b.dataset.t); majOutils(); } });
    document.getElementById('gomme').addEventListener('click', () => { if (couleur !== '#ffffff') { avantGomme = couleur; couleur = '#ffffff'; epaisseur = 22; } else if (avantGomme) { couleur = avantGomme; avantGomme = null; } majOutils(); });
    document.getElementById('effacer').addEventListener('click', () => { if (!jeDessine()) return; effacer(); ctxJeu.envoyer({ t: 'effacer' }); });

    const jeDessine = () => vue && ctxJeu && vue.phase === 'dessin' && vue.dessinateur === ctxJeu.moi;

    function position(e) {
      const r = tableau.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) * 1000 / r.width), Math.round((e.clientY - r.top) * 700 / r.height)];
    }
    function envoyerAttente(force) {
      if (enAttente.length < (premierEnvoi ? 2 : 4)) return;
      const maintenant = performance.now();
      if (!force && maintenant - dernierEnvoi < 50) return;
      dernierEnvoi = maintenant;
      ctxJeu.envoyer({ t: 'trait', p: enAttente, c: couleur, w: epaisseur });
      premierEnvoi = false;
      const dernier = enAttente.slice(-2);
      enAttente = trace ? dernier : [];
    }
    tableau.addEventListener('pointerdown', e => {
      if (!jeDessine()) return;
      e.preventDefault();
      tableau.setPointerCapture(e.pointerId);
      const p = position(e);
      trace = p;
      enAttente = [...p];
      premierEnvoi = true;
      dessinerTrait(p, couleur, epaisseur);
    });
    tableau.addEventListener('pointermove', e => {
      if (!trace || !jeDessine()) return;
      const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of evts) {
        const p = position(ev);
        if (Math.hypot(p[0] - trace[0], p[1] - trace[1]) < 3) continue;
        dessinerTrait([...trace, ...p], couleur, epaisseur);
        trace = p;
        enAttente.push(...p);
        if (enAttente.length >= 380) envoyerAttente(true);
      }
      envoyerAttente(false);
    });
    const finTrace = () => { if (!trace) return; trace = null; envoyerAttente(true); enAttente = []; };
    tableau.addEventListener('pointerup', finTrace);
    tableau.addEventListener('pointercancel', finTrace);

    // propositions
    document.getElementById('devine').addEventListener('submit', e => {
      e.preventDefault();
      const champ = document.getElementById('essai');
      const mot = champ.value.trim();
      if (!mot || !ctxJeu) return;
      ctxJeu.envoyer({ t: 'devine', mot });
      champ.value = '';
      champ.focus();
    });
    document.getElementById('voile').addEventListener('click', e => {
      const b = e.target.closest('[data-mot]');
      if (b) ctxJeu.envoyer({ t: 'mot', i: Number(b.dataset.mot) });
    });

    function afficher(v, ctx) {
      const nouvellePhase = !vue || vue.phase !== v.phase || vue.tour !== v.tour;
      vue = v; ctxJeu = ctx;
      finLocale = performance.now() + v.reste;
      duree = v.duree;
      const qui = v.dessinateur;
      const moiDessine = qui === ctx.moi;
      const trouve = v.trouves.includes(ctx.moi);
      jeu.classList.toggle('dessine', moiDessine && v.phase === 'dessin');

      document.getElementById('tour').innerHTML = v.phase === 'intro' ? 'Prêts ?' : `Tour <b>${Math.min(v.tour, v.nbTours)}</b> / ${v.nbTours}`;
      const mot = document.getElementById('mot');
      if (v.phase === 'dessin') mot.innerHTML = moiDessine ? `<small>Dessine</small>${echapper(v.mot)}` : trouve ? `<small>Trouvé !</small>${echapper(v.mot)}` : `<small>${[...v.masque].filter(c => c === '_').length} lettres</small>${echapper(v.masque.split('').join(' '))}`;
      else mot.innerHTML = '';

      const voile = document.getElementById('voile');
      if (v.phase === 'intro') { voile.hidden = false; voile.innerHTML = '<h2>Dessine et devine</h2><p>Chacun dessine à son tour. Les autres devinent le mot.</p>'; }
      else if (v.phase === 'choix') {
        voile.hidden = false;
        voile.innerHTML = moiDessine && v.choix
          ? `<h2>À toi de dessiner !</h2><p>Choisis un mot :</p><div class="mots">${v.choix.map((m, i) => `<button data-mot="${i}">${echapper(m)}</button>`).join('')}</div>`
          : `<h2>${echapper(ctx.nom(qui))} choisit un mot…</h2><p>Prépare-toi à deviner.</p>`;
        if (nouvellePhase) effacer();
      } else if (v.phase === 'bilan') { voile.hidden = false; voile.innerHTML = `<p>Le mot était</p><h2>${echapper(v.dernierMot)}</h2><p>${v.trouves.length} joueur${v.trouves.length > 1 ? 's ont' : ' a'} trouvé.</p>`; }
      else voile.hidden = true;

      document.getElementById('outils').hidden = !(moiDessine && v.phase === 'dessin');
      const devine = document.getElementById('devine');
      devine.hidden = moiDessine || v.phase !== 'dessin' || ctx.spectateur;
      devine.querySelector('input').disabled = trouve;
      devine.querySelector('input').placeholder = trouve ? 'Bien joué, tu as trouvé !' : 'Ta proposition…';
      if (nouvellePhase && v.phase === 'dessin' && !moiDessine && !TACTILE) setTimeout(() => devine.querySelector('input').focus(), 50);
      if (nouvellePhase) document.getElementById('retour').textContent = v.phase === 'dessin' && moiDessine ? 'Dessine ! Les autres ne voient pas le mot.' : '';

      document.getElementById('joueurs').innerHTML = [...v.j].sort((a, b) => v.scores[b] - v.scores[a]).map(id => `
        <div class="${v.trouves.includes(id) ? 'trouve' : ''}"><i style="background:${ctx.couleur(id)}"></i><span>${id === qui && v.phase !== 'bilan' ? '✎ ' : ''}${echapper(ctx.nom(id))}${id === ctx.moi ? ' (toi)' : ''}</span><b>${v.scores[id]}</b></div>`).join('');
    }

    function evenement(ev, ctx) {
      if (ev[0] === 'trait') dessinerTrait(ev[1], ev[2], ev[3]);
      if (ev[0] === 'effacer') effacer();
      if (ev[0] === 'trouve') ctx.toast(ev[1] === ctx.moi ? `Bravo, tu as trouvé ! +${ev[2]}` : `${ctx.nom(ev[1])} a trouvé !`, 1800);
      if (ev[0] === 'presque') document.getElementById('retour').textContent = `« ${ev[1]} » : presque !`;
      if (ev[0] === 'rate') document.getElementById('retour').textContent = `« ${ev[1]} » : non, essaie encore.`;
    }

    function boucle() {
      requestAnimationFrame(boucle);
      if (!vue) return;
      const enCours = vue.phase === 'dessin' || vue.phase === 'choix';
      document.getElementById('chrono').textContent = enCours ? Math.ceil(Math.max(0, finLocale - performance.now()) / 1000) + ' s' : '—';
    }
    requestAnimationFrame(boucle);

    demarrerJeu({
      id: 'dessin',
      moteur,
      zone: jeu,
      titre: 'Dessine et devine',
      intro: 'Chacun son tour, un joueur dessine un mot secret et les autres le devinent. Plus tu trouves vite, plus tu marques. Il faut être au moins 2.',
      regles: [['Dessiner', 'Choisis un mot parmi 3.'], ['Deviner', 'Tape le mot que tu reconnais.'], ['Marquer', 'Trouver vite rapporte plus.']],
      debut() { vue = null; effacer(); dimension(); },
      afficher,
      evenement
    });
    effacer();
  </script>
</body>
</html>
