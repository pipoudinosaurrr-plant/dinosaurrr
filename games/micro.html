<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Micro</title>
  <link rel="stylesheet" href="jeu.css">
  <link rel="stylesheet" href="multi/salon.css">
  <style>
    #jeu { position: fixed; inset: 0; padding: 48px 6px 6px; touch-action: none; background: #050505; }
    #jeu[hidden] { display: none; }
    #toile { display: block; width: 100%; height: 100%; }
    .tactile #jeu { padding-bottom: 110px; }
    .commandes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: none; justify-content: space-between; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
    .tactile #jeu:not([hidden]) ~ .commandes { display: flex; }
    .commandes div { display: flex; gap: 10px; }
    .commandes button { pointer-events: auto; width: 84px; height: 84px; border: 1px solid #2a2a2a; border-radius: 18px; background: rgba(24, 24, 27, .9); color: #fff; font: 700 26px var(--police); touch-action: none; }
    .commandes button small { display: block; font-size: 11px; color: var(--doux); }
    .commandes button.appuye { background: #3f3f46; }
  </style>
</head>
<body>
  <main id="jeu" hidden><canvas id="toile"></canvas></main>
  <div class="commandes" id="commandes">
    <div><button data-k="g">◀</button><button data-k="d">▶</button></div>
    <div><button data-k="f"><small>FREIN</small>▼</button></div>
  </div>

  <script src="../assets/config.js"></script>
  <script type="module">
    import { demarrerJeu, TACTILE } from './multi/salon.js';
    import moteur, { TOURS } from './multi/jeux/micro.js';
    import { construire, MONDE } from './micro/pistes.js';

    if (TACTILE) document.body.classList.add('tactile');
    const toile = document.getElementById('toile');
    const ctx = toile.getContext('2d');
    const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

    /* ---------- Sons : un petit moteur par voiture locale ---------- */
    let audio = null, moteurSon = null;
    function demarrerSon() {
      try {
        if (localStorage.getItem('site-son') === 'false' || moteurSon) return;
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain(), f = audio.createBiquadFilter();
        o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.0001;
        o.connect(f).connect(g).connect(audio.destination); o.start();
        moteurSon = { o, g };
      } catch (e) { /* rien */ }
    }
    function arreterSon() { if (moteurSon) { try { moteurSon.o.stop(); } catch (e) { /* rien */ } moteurSon = null; } }
    function bip(f1, f2, d, type = 'square', vol = 0.05) {
      try {
        if (localStorage.getItem('site-son') === 'false') return;
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
        o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + 0.02);
      } catch (e) { /* rien */ }
    }

    /* ---------- Le circuit (dessiné une fois) ---------- */
    let piste = null, fondPiste = null, traces = null;
    const SOLS = { herbe: ['#2f6b2f', '#2a6229'], carrelage: ['#d9d4c7', '#c9c3b4'], bois: ['#8a5a32', '#7c4f2b'] };
    function preparerPiste(id) {
      piste = construire(id);
      fondPiste = document.createElement('canvas'); fondPiste.width = MONDE.l; fondPiste.height = MONDE.h;
      const c = fondPiste.getContext('2d');
      const [s1, s2] = SOLS[piste.sol] || SOLS.herbe;
      c.fillStyle = s1; c.fillRect(0, 0, MONDE.l, MONDE.h);
      if (piste.sol === 'carrelage') { c.fillStyle = s2; for (let x = 0; x < MONDE.l; x += 50) for (let y = 0; y < MONDE.h; y += 50) if ((x + y) / 50 % 2) c.fillRect(x, y, 50, 50); c.strokeStyle = 'rgba(0,0,0,.08)'; for (let x = 0; x <= MONDE.l; x += 50) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, MONDE.h); c.stroke(); } for (let y = 0; y <= MONDE.h; y += 50) { c.beginPath(); c.moveTo(0, y); c.lineTo(MONDE.l, y); c.stroke(); } }
      else if (piste.sol === 'bois') { c.fillStyle = s2; for (let y = 0; y < MONDE.h; y += 28) { c.fillRect(0, y, MONDE.l, 2); for (let x = (y / 28 % 2) * 90; x < MONDE.l; x += 180) c.fillRect(x, y, 2, 28); } }
      else { for (let k = 0; k < 900; k++) { c.fillStyle = Math.random() < 0.5 ? s2 : '#357a35'; c.fillRect(Math.random() * MONDE.l, Math.random() * MONDE.h, 3, 3); } }
      // la route : la bande entre les deux bords
      const route = new Path2D();
      route.moveTo(...piste.gauche[0]); for (const p of piste.gauche) route.lineTo(...p); route.closePath();
      route.moveTo(...piste.droite[0]); for (const p of piste.droite) route.lineTo(...p); route.closePath();
      c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 12; c.fillStyle = '#3a3a3e'; c.fill(route, 'evenodd'); c.restore();
      // la ligne du milieu, en pointillés
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; c.setLineDash([14, 14]);
      c.beginPath(); piste.milieu.forEach((p, i) => (i ? c.lineTo(...p) : c.moveTo(...p))); c.closePath(); c.stroke(); c.setLineDash([]);
      // les bordures rouges et blanches
      for (const bord of [piste.gauche, piste.droite]) {
        for (let i = 0; i < bord.length; i++) {
          const a = bord[i], b = bord[(i + 1) % bord.length];
          c.strokeStyle = Math.floor(i / 2) % 2 ? '#ef4444' : '#f5f5f5'; c.lineWidth = 6;
          c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.stroke();
        }
      }
      // la ligne d'arrivée en damier
      const m = piste.milieu[0], d = piste.dirs[0], L = piste.largeur;
      c.save(); c.translate(m[0], m[1]); c.rotate(Math.atan2(d[1], d[0]));
      for (let k = 0; k < L / 8; k++) for (let r = 0; r < 2; r++) { c.fillStyle = (k + r) % 2 ? '#fff' : '#111'; c.fillRect(-8 + r * 8, -L / 2 + k * 8, 8, 8); }
      c.restore();
      traces = document.createElement('canvas'); traces.width = MONDE.l; traces.height = MONDE.h;
    }

    /* ---------- État et interpolation ---------- */
    let ctxJeu = null, prec = null, cour = null, tCour = 0, intervalle = 33, vue = null;
    const lerp = (a, b, k) => a + (b - a) * k;
    const lerpAngle = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * k; };

    function redim() {
      const r = toile.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      toile.width = Math.round(r.width * dpr); toile.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', redim);

    // x, y : position à l'écran ; e : échelle du monde
    function voiture(x, y, a, couleur, nom, moi, e = 1) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(e, e);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-11 + 2, -6.5 + 3, 22, 13);
      ctx.fillStyle = couleur; ctx.beginPath(); ctx.roundRect(-11, -6.5, 22, 13, 4); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(1, -5, 5, 10);                // pare-brise
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-9, -2, 8, 4);          // bande
      ctx.fillStyle = '#fef08a'; ctx.fillRect(9, -5, 2, 3); ctx.fillRect(9, 2, 2, 3); // phares
      ctx.fillStyle = '#111'; for (const [px, py] of [[-7, -7.5], [5, -7.5], [-7, 6], [5, 6]]) ctx.fillRect(px, py, 5, 1.6);
      ctx.restore();
      if (nom) {
        ctx.font = `700 10px ${MONO}`; ctx.textAlign = 'center';
        const w = ctx.measureText(nom).width;
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - w / 2 - 3, y - 26, w + 6, 13);
        ctx.fillStyle = moi ? '#fde047' : '#fff'; ctx.fillText(nom, x, y - 16);
      }
    }
    // téléphone tenu droit : on tourne le circuit d'un quart de tour pour qu'il remplisse l'écran
    let vers = null;

    function dessiner() {
      requestAnimationFrame(dessiner);
      if (!piste || !cour) return;
      const r = toile.getBoundingClientRect();
      const W = r.width, H = r.height;
      const tourne = H > W * 1.15;
      const lw = tourne ? MONDE.h : MONDE.l, lh = tourne ? MONDE.l : MONDE.h;
      const e = Math.min(W / lw, (H - (tourne ? 70 : 0)) / lh);
      const ox = (W - lw * e) / 2, oy = (H - lh * e) / 2 + (tourne ? 35 : 0);
      // du monde vers l'écran
      vers = tourne ? (x, y) => [ox + (MONDE.h - y) * e, oy + x * e] : (x, y) => [ox + x * e, oy + y * e];
      const plusAngle = tourne ? Math.PI / 2 : 0;
      ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
      ctx.save();
      if (tourne) { ctx.translate(ox + MONDE.h * e, oy); ctx.rotate(Math.PI / 2); ctx.scale(e, e); }
      else { ctx.translate(ox, oy); ctx.scale(e, e); }
      ctx.drawImage(fondPiste, 0, 0);
      ctx.drawImage(traces, 0, 0);
      ctx.restore();
      const k = prec ? Math.min(1, (performance.now() - tCour) / intervalle) : 1;
      const locaux = ctxJeu.locaux;
      const tc = traces.getContext('2d');
      for (const v of cour.v) {
        const p = prec && prec.v.find(x => x.id === v.id) || v;
        const x = lerp(p.x, v.x, k), y = lerp(p.y, v.y, k), a = lerpAngle(p.a, v.a, k);
        if (v.d) { tc.fillStyle = 'rgba(0,0,0,.18)'; for (const s of [-1, 1]) tc.fillRect(x - Math.cos(a) * 8 + Math.sin(a) * 5 * s - 1, y - Math.sin(a) * 8 - Math.cos(a) * 5 * s - 1, 2.4, 2.4); }
        const moi = v.id === ctxJeu.moi || (locaux > 1 && /^moi\d?$/.test(v.id));
        const [sx, sy] = vers(x, y);
        voiture(sx, sy, a + plusAngle, ctxJeu.couleur(v.id), ctxJeu.nom(v.id).slice(0, 10), moi, Math.max(0.6, e * 1.1));
      }
      // classement et tours
      const ordre = [...cour.v].sort((a, b) => (a.f && b.f ? a.f - b.f : a.f ? -1 : b.f ? 1 : (b.p * 1e4 + b.i) - (a.p * 1e4 + a.i)));
      ctx.font = `700 13px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ordre.forEach((v, i) => {
        const tour = v.f ? 'arrivé' : `tour ${Math.max(1, Math.min(TOURS, v.p))}/${TOURS}`;
        const t = `${i + 1}. ${ctxJeu.nom(v.id).slice(0, 10)} · ${tour}`;
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(8, 8 + i * 20, ctx.measureText(t).width + 12, 18);
        ctx.fillStyle = ctxJeu.couleur(v.id); ctx.fillText(t, 14, 11 + i * 20);
      });
      // décompte
      const reste = Math.max(0, cour.depart - (performance.now() - tCour));
      if (reste > 0 || performance.now() - tDepart < 800) {
        ctx.font = `900 ${Math.min(W, H) * 0.18}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = reste > 0 ? '#facc15' : '#22c55e';
        ctx.fillText(reste > 0 ? String(Math.ceil(reste / 1000)) : 'GO !', W / 2, H / 2);
      }
      // le bruit du moteur suit la vitesse de ma voiture
      const mienne = cour.v.find(v => v.id === ctxJeu.moi);
      if (moteurSon && mienne && audio) { moteurSon.o.frequency.setTargetAtTime(50 + mienne.s * 0.45, audio.currentTime, 0.05); moteurSon.g.gain.setTargetAtTime(0.025 + mienne.s / 330 * 0.02, audio.currentTime, 0.1); }
    }
    let tDepart = 0;
    requestAnimationFrame(dessiner);

    /* ---------- Commandes : jusqu'à 4 joueurs sur le même clavier ---------- */
    const CLAVIER = [
      { ArrowUp: 'a', ArrowDown: 'f', ArrowLeft: 'g', ArrowRight: 'd' },
      { KeyW: 'a', KeyS: 'f', KeyA: 'g', KeyD: 'd' },
      { KeyI: 'a', KeyK: 'f', KeyJ: 'g', KeyL: 'd' },
      { Numpad8: 'a', Numpad5: 'f', Numpad4: 'g', Numpad6: 'd' }
    ];
    const etats = [0, 1, 2, 3].map(() => ({ a: false, f: false, g: false, d: false }));
    const idJoueur = n => (n === 0 ? (ctxJeu ? ctxJeu.moi : 'moi') : 'moi' + (n + 1));
    function envoyer(n) {
      if (!ctxJeu) return;
      const s = etats[n];
      // sur téléphone, la voiture accélère toute seule (sauf si on freine)
      const d = { t: 'touches', ...s, a: s.a || (TACTILE && n === 0 && !s.f) };
      if (n === 0) ctxJeu.envoyer(d); else ctxJeu.envoyerPour(idJoueur(n), d);
    }
    function touche(e, appui) {
      if (!ctxJeu || document.getElementById('jeu').hidden) return;
      const locaux = ctxJeu.locaux;
      for (let n = 0; n < Math.max(1, locaux); n++) {
        // en solo ou en ligne, les deux jeux de touches pilotent la même voiture
        const tables = locaux > 1 ? [CLAVIER[n]] : [CLAVIER[0], CLAVIER[1]];
        for (const t of tables) {
          const k = t[e.code];
          if (!k) continue;
          e.preventDefault();
          if (etats[n][k] !== appui) { etats[n][k] = appui; envoyer(n); }
        }
      }
    }
    addEventListener('keydown', e => { if (!e.repeat) touche(e, true); });
    addEventListener('keyup', e => touche(e, false));
    for (const b of document.querySelectorAll('#commandes button')) {
      const k = b.dataset.k;
      const fin = () => { b.classList.remove('appuye'); etats[0][k] = false; envoyer(0); };
      b.addEventListener('pointerdown', ev => { ev.preventDefault(); b.classList.add('appuye'); try { b.setPointerCapture(ev.pointerId); } catch (err) { /* rien */ } etats[0][k] = true; envoyer(0); });
      b.addEventListener('pointerup', fin); b.addEventListener('pointercancel', fin); b.addEventListener('lostpointercapture', fin);
    }

    demarrerJeu({
      id: 'micro',
      moteur,
      zone: document.getElementById('jeu'),
      titre: 'Micro',
      intro: 'Des petites voitures vues de dessus, 4 tours de circuit. Joue en ligne, contre l’ordinateur ou jusqu’à 4 sur le même écran. Attention : ça glisse dans les virages !',
      regles: [['Joueur 1', '↑ accélérer · ↓ freiner · ← → tourner'], ['Joueur 2', 'W S A D (Z S Q D)'], ['Joueur 3', 'I K J L'], ['Joueur 4', 'pavé numérique 8 5 4 6']],
      reglesTactile: [['Accélérer', 'tout seul'], ['Tourner', '◀ ▶'], ['Freiner', 'FREIN']],
      soloBots: 3,
      joueursLocaux: 4,
      totalLocal: 4,
      surAccueil() { arreterSon(); },
      debut(ctx) {
        ctxJeu = ctx; prec = null; cour = null; piste = null;
        etats.forEach(s => { s.a = s.f = s.g = s.d = false; });
        setTimeout(redim, 0);
        demarrerSon();
      },
      evenement(ev, ctx) {
        const [quoi, id, n] = ev;
        if (quoi === 'choc' && (id === ctx.moi || /^moi\d?$/.test(id))) bip(160, 70, 0.12, 'square', 0.05);
        if (quoi === 'tour' && (id === ctx.moi || (ctx.locaux > 1 && /^moi\d?$/.test(id)))) { bip(880, 1320, 0.12, 'square', 0.05); if (n === TOURS) ctx.toast(`${ctx.nom(id)} : dernier tour !`, 1500); }
        if (quoi === 'arrivee') { ctx.toast(`${ctx.nom(id)} a fini en ${(n / 1000).toFixed(2)} s`, 2000); if (id === ctx.moi) arreterSon(); }
      },
      afficher(v, ctx) {
        ctxJeu = ctx;
        if (!piste || piste.id !== v.circuit) { preparerPiste(v.circuit); prec = null; }
        const maintenant = performance.now();
        if (cour) { intervalle = Math.max(16, Math.min(120, maintenant - tCour)); prec = cour; }
        if (cour && cour.depart > 0 && v.depart === 0) { tDepart = maintenant; bip(880, 880, 0.35, 'square', 0.07); }
        else if (cour && Math.ceil(cour.depart / 1000) !== Math.ceil(v.depart / 1000) && v.depart > 0) bip(440, 440, 0.15, 'square', 0.06);
        if (!cour) envoyer(0);      // sur téléphone : la voiture accélère toute seule dès le départ
        cour = v; tCour = maintenant;
        if (v.fini) arreterSon();
      }
    });
    addEventListener('pagehide', arreterSon);
  </script>
</body>
</html>
