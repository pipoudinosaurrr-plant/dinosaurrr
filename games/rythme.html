<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rythme</title>
  <link rel="stylesheet" href="jeu.css">
  <style>
    html, body { overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; background: #06040d; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="jeu" aria-label="Rythme"></canvas>
  <script src="../assets/config.js"></script>
  <script src="../assets/musique.js"></script>
  <script src="arcade.js"></script>
<script>
(() => {
  'use strict';
  const A = window.Arcade;
  const M = window.DinoMusique;
  const W = 520, H = 760;
  const T = A.toile(document.getElementById('jeu'), { largeur: W, hauteur: H });
  const ctx = T.ctx;
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const POLICE = '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  const VOIES = 4, LX = 70, LW = 95, LIGNE = H - 130;
  const COULEURS = ['#f43f5e', '#22d3ee', '#a3e635', '#facc15'];
  /* ---------- Les touches : plusieurs dispositions (clavier AZERTY, QWERTY…) ----------
     On lit la lettre vraiment tapée (e.key) : « Q » est bien « Q », que le clavier soit AZERTY ou QWERTY.
     Les flèches ← ↓ ↑ → marchent toujours en plus. */
  const DISPOSITIONS = {
    dfjk: { nom: 'D F J K', sous: 'Deux mains, tous claviers', touches: ['d', 'f', 'j', 'k'] },
    azerty: { nom: 'Q S D F', sous: 'AZERTY, main gauche', touches: ['q', 's', 'd', 'f'] },
    azerty2: { nom: 'J K L M', sous: 'AZERTY, main droite', touches: ['j', 'k', 'l', 'm'] },
    qwerty: { nom: 'A S D F', sous: 'QWERTY, main gauche', touches: ['a', 's', 'd', 'f'] },
    perso: { nom: 'À toi de choisir', sous: '4 touches au choix', touches: null }
  };
  const FLECHES = { ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
  let disposition = A.stock.lire('rythme-touches', 'dfjk');
  if (!DISPOSITIONS[disposition]) disposition = 'dfjk';
  let touchesPerso = A.stock.lire('rythme-touches-perso', null);
  if (!Array.isArray(touchesPerso) || touchesPerso.length !== 4) touchesPerso = ['d', 'f', 'j', 'k'];
  const mesTouches = () => (disposition === 'perso' ? touchesPerso : DISPOSITIONS[disposition].touches);
  const nomTouche = k => (k === ' ' ? 'Espace' : k.length === 1 ? k.toUpperCase() : k);
  let NOMS_TOUCHES = mesTouches().map(nomTouche);
  // quelle colonne pour cette touche ?
  function voieDe(e) {
    if (FLECHES[e.code] !== undefined) return FLECHES[e.code];
    const k = (e.key || '').toLowerCase();
    const i = mesTouches().indexOf(k);
    return i >= 0 ? i : undefined;
  }
  const FENETRES = [[45, 'PARFAIT', 300, '#facc15'], [90, 'SUPER', 200, '#4ade80'], [140, 'BIEN', 100, '#38bdf8']];
  const DIFFICULTES = {
    facile: { nom: 'Facile', ecart: 0.42, chute: 2.0, garder: 0.45 },
    normal: { nom: 'Normal', ecart: 0.22, chute: 1.55, garder: 0.75 },
    difficile: { nom: 'Difficile', ecart: 0.12, chute: 1.2, garder: 1 }
  };

  /* ---------- Les morceaux : tes musiques (Pages CMS) et les chiptunes du site ---------- */
  const PISTES = (M ? M.pistes : []).map((p, i) => ({ ...p, n: i }));
  let choix = Number(A.stock.lire('rythme-piste', 0)) || 0;
  if (!PISTES[choix]) choix = 0;
  let difficulte = A.stock.lire('rythme-difficulte', 'normal');
  if (!DIFFICULTES[difficulte]) difficulte = 'normal';
  const cle = () => 'rythme-' + (PISTES[choix] ? (PISTES[choix].fichier || 'chip' + PISTES[choix].i) : 'x') + '-' + difficulte;

  let audio = null;
  const contexte = () => { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); return audio; };

  // détecter les « coups » d'une musique : on découpe en 3 bandes (basses, médiums, aigus) et on cherche les montées d'énergie
  async function analyser(buffer) {
    const Hors = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const taux = 22050;
    const bandes = [['lowpass', 160], ['bandpass', 1200], ['highpass', 5000]];
    const enveloppes = await Promise.all(bandes.map(async ([type, f]) => {
      const a = new Hors(1, Math.ceil(buffer.duration * taux), taux);
      const s = a.createBufferSource(); s.buffer = buffer;
      const filtre = a.createBiquadFilter(); filtre.type = type; filtre.frequency.value = f; filtre.Q.value = 0.8;
      s.connect(filtre).connect(a.destination); s.start();
      const rendu = await a.startRendering();
      const d = rendu.getChannelData(0);
      const pas = 512, env = new Float32Array(Math.floor(d.length / pas));
      for (let i = 0; i < env.length; i++) { let e = 0; for (let k = 0; k < pas; k++) { const v = d[i * pas + k]; e += v * v; } env[i] = Math.sqrt(e / pas); }
      return { env, dt: pas / taux };
    }));
    const evts = [];
    enveloppes.forEach(({ env, dt }, b) => {
      const flux = new Float32Array(env.length);
      for (let i = 3; i < env.length; i++) flux[i] = Math.max(0, env[i] - (env[i - 1] + env[i - 2] + env[i - 3]) / 3);
      const fen = Math.round(0.6 / dt);
      let dernier = -1;
      for (let i = 1; i < flux.length - 1; i++) {
        if (flux[i] < flux[i - 1] || flux[i] < flux[i + 1]) continue;
        let s = 0, n = 0;
        for (let k = Math.max(0, i - fen); k < Math.min(flux.length, i + fen); k++) { s += flux[k]; n++; }
        const seuil = (s / n) * 1.9 + 0.002;
        if (flux[i] > seuil && (dernier < 0 || (i - dernier) * dt > 0.09)) { evts.push({ t: i * dt, force: flux[i] / seuil, bande: b }); dernier = i; }
      }
    });
    return evts.sort((a, b) => a.t - b.t);
  }

  // à partir des coups : des notes réparties sur les 4 voies (pas trop serrées selon la difficulté)
  function fabriquerNotes(evts, diff) {
    const D = DIFFICULTES[diff];
    const notes = [];
    let derniere = -1, voie = 1, alea = 7;
    const hasard = () => ((alea = (alea * 16807) % 2147483647) / 2147483647);
    const forts = [...evts].sort((a, b) => b.force - a.force);
    const garder = new Set(forts.slice(0, Math.ceil(forts.length * D.garder)));
    for (const e of evts) {
      if (!garder.has(e) || e.t < 1) continue;
      if (derniere >= 0 && e.t - derniere < D.ecart) continue;
      // basses à gauche, aigus à droite, avec un peu de variété
      const base = e.bande === 0 ? (hasard() < 0.5 ? 0 : 1) : e.bande === 1 ? (hasard() < 0.5 ? 1 : 2) : (hasard() < 0.6 ? 3 : 2);
      voie = base === voie && hasard() < 0.5 ? (base + 1 + Math.floor(hasard() * 3)) % 4 : base;
      notes.push({ t: e.t, v: voie, etat: 0 });
      // en difficile, des accords (deux notes ensemble) sur les gros coups
      if (diff === 'difficile' && e.force > 3 && hasard() < 0.5) notes.push({ t: e.t, v: (voie + 2) % 4, etat: 0 });
      derniere = e.t;
    }
    return notes;
  }

  async function charger(piste) {
    const a = contexte();
    if (piste.type === 'chip') {
      const buffer = await M.rendre(piste.i);
      // pour les chiptunes, on connaît la partition : mélodie et batterie = des notes parfaites
      const part = M.partition(piste.i);
      const evts = [];
      for (const p of part.pas) {
        const t = p.t + 0.05;
        if (p.melodie) evts.push({ t, force: 2.5, bande: /([A-G]#?)(\d)/.exec(p.melodie)[2] >= 5 ? 2 : 1 });
        if (p.kick) evts.push({ t, force: 2.2, bande: 0 });
        if (p.caisse) evts.push({ t, force: 2, bande: 1 });
        if (p.charley && Math.random() < 0.15) evts.push({ t, force: 1.2, bande: 2 });
      }
      return { buffer, evts };
    }
    const r = await fetch('../' + piste.fichier);
    if (!r.ok) throw new Error('fichier');
    const buffer = await a.decodeAudioData(await r.arrayBuffer());
    return { buffer, evts: await analyser(buffer) };
  }

  /* ---------- Partie ---------- */
  let etat = 'menu', notes = [], source = null, debut = 0, duree = 0, score = 0, combo = 0, comboMax = 0, compte = [0, 0, 0, 0], message = null, appuis = [0, 0, 0, 0], eclats = [], chute = 1.55, rate = 0;
  const cacheAnalyse = {};
  const tempsChanson = () => (audio ? audio.currentTime - debut - (audio.outputLatency || audio.baseLatency || 0) : 0);

  async function lancer() {
    const piste = PISTES[choix];
    if (!piste) return;
    etat = 'chargement';
    A.panneau({ titre: 'Chargement…', texte: piste.type === 'chip' ? 'Préparation du morceau…' : 'Analyse de la musique pour placer les notes (quelques secondes)…' });
    try {
      const k = piste.fichier || 'chip' + piste.i;
      const donnees = cacheAnalyse[k] || (cacheAnalyse[k] = await charger(piste));
      notes = fabriquerNotes(donnees.evts, difficulte);
      duree = donnees.buffer.duration;
      chute = DIFFICULTES[difficulte].chute;
      A.fermerPanneau();
      score = 0; combo = 0; comboMax = 0; compte = [0, 0, 0, 0]; message = null; eclats = []; rate = 0;
      const a = contexte();
      source = a.createBufferSource(); source.buffer = donnees.buffer;
      const g = a.createGain(); g.gain.value = A.sonActif === false ? 0 : 0.9;
      source.connect(g).connect(a.destination);
      debut = a.currentTime + 2;      // 2 secondes pour se préparer
      source.start(debut);
      source.onended = () => { if (etat === 'jeu') fin(); };
      etat = 'jeu';
    } catch (e) {
      etat = 'menu';
      A.panneau({ titre: 'Impossible de lire ce morceau', texte: 'Vérifie ta connexion internet (les musiques envoyées ne marchent pas hors ligne) ou choisis un autre morceau.', boutons: [{ texte: 'Menu', primaire: true, action: menu }] });
    }
  }

  function taper(v) {
    if (etat !== 'jeu') return;
    appuis[v] = 0.12;
    const t = tempsChanson();
    let meilleure = null, ecart = Infinity;
    for (const n of notes) {
      if (n.v !== v || n.etat) continue;
      const d = Math.abs(n.t - t) * 1000;
      if (d < ecart) { ecart = d; meilleure = n; }
      if (n.t - t > 0.3) break;
    }
    if (!meilleure || ecart > FENETRES[FENETRES.length - 1][0]) return;
    const k = FENETRES.findIndex(f => ecart <= f[0]);
    const [, texte, points, couleur] = FENETRES[k];
    meilleure.etat = 1;
    combo++; comboMax = Math.max(comboMax, combo);
    compte[k]++;
    score += Math.round(points * (1 + Math.min(4, Math.floor(combo / 25)) * 0.5));
    message = { texte, couleur, t: 0.5 };
    eclats.push({ v, t: 0.3, c: couleur });
  }

  function fin() {
    etat = 'fin';
    if (source) { try { source.stop(); } catch (e) { /* rien */ } source = null; }
    const total = notes.length || 1;
    const precision = (compte[0] + compte[1] * 0.75 + compte[2] * 0.5) / total;
    const note = precision >= 0.95 ? 'S' : precision >= 0.85 ? 'A' : precision >= 0.7 ? 'B' : precision >= 0.5 ? 'C' : 'D';
    const r = A.record(cle(), score);
    A.finPartie('rythme', { score, gagne: precision >= 0.8 });
    A.son(precision >= 0.7 ? 'gagne' : 'perdu');
    A.panneau({
      pastille: PISTES[choix].titre + ' · ' + DIFFICULTES[difficulte].nom,
      titre: `Note ${note} · ${Math.round(precision * 100)} %`,
      texte: r.nouveau ? 'Nouveau record !' : `Record : ${A.format(r.record || 0)}`,
      lignes: [['Score', A.format(score)], ['Combo max', String(comboMax)], ['Parfait / Super / Bien', `${compte[0]} / ${compte[1]} / ${compte[2]}`], ['Ratés', String(compte[3])]],
      boutons: [{ texte: 'Rejouer', primaire: true, action: lancer }, { texte: 'Menu', action: menu }]
    });
  }

  function arreterPartie() { if (source) { try { source.stop(); } catch (e) { /* rien */ } source = null; } }

  function menu() {
    arreterPartie();
    etat = 'menu';
    if (M) M.arreter();
    A.panneau({
      pastille: 'Rythme', titre: 'Rythme',
      texte: 'Tape les notes au moment où elles touchent la ligne. Les notes sont fabriquées automatiquement à partir de la musique !',
      titreChoix: 'Morceau',
      choix: PISTES.map((p, i) => {
        const rec = A.record('rythme-' + (p.fichier || 'chip' + p.i) + '-' + difficulte);
        return { texte: p.titre, sous: (p.type === 'fichier' ? (p.auteur || 'Ta musique') : 'Chiptune · ' + p.tempo + ' bpm') + (rec ? ' · record ' + A.format(rec) : ''), actif: i === choix, action: () => { choix = i; A.stock.ecrire('rythme-piste', i); } };
      }),
      titreChoix2: 'Difficulté',
      choix2: Object.entries(DIFFICULTES).map(([id, d]) => ({ texte: d.nom, actif: id === difficulte, action: () => { difficulte = id; A.stock.ecrire('rythme-difficulte', id); } })),
      lignes: A.TACTILE ? [['Jouer', 'Touche les 4 colonnes en bas']] : [['Touches', `${NOMS_TOUCHES.join(' ')} (ou ← ↓ ↑ →)`], ['Pause', 'Échap']],
      boutons: [{ texte: 'Jouer', primaire: true, action: lancer }, ...(A.TACTILE ? [] : [{ texte: '⌨️ Changer les touches', action: menuTouches }])]
    });
  }
  // choisir ses touches : des dispositions toutes prêtes, ou 4 touches au choix
  let enregistrement = null;
  function menuTouches() {
    A.panneau({
      pastille: 'Rythme', titre: 'Les touches',
      texte: 'Choisis les 4 touches pour les 4 colonnes (de gauche à droite). Les flèches marchent toujours aussi.',
      choix: Object.entries(DISPOSITIONS).map(([id, d]) => ({
        texte: id === 'perso' ? `${d.nom}${disposition === 'perso' ? ' : ' + touchesPerso.map(nomTouche).join(' ') : ''}` : d.nom, sous: d.sous, actif: id === disposition,
        action: () => { if (id === 'perso') enregistrerTouches(); else { disposition = id; A.stock.ecrire('rythme-touches', id); NOMS_TOUCHES = mesTouches().map(nomTouche); menuTouches(); } }
      })),
      boutons: [{ texte: 'OK', primaire: true, action: menu }]
    });
  }
  function enregistrerTouches() {
    enregistrement = [];
    const suite = () => A.panneau({ pastille: 'Rythme', titre: `Appuie sur la touche de la colonne ${enregistrement.length + 1} sur 4`, texte: enregistrement.length ? 'Déjà choisies : ' + enregistrement.map(nomTouche).join(' ') : 'Colonne la plus à gauche d’abord.', boutons: [{ texte: 'Annuler', action: () => { enregistrement = null; menuTouches(); } }] });
    enregistrement.suite = suite;
    suite();
  }
  addEventListener('keydown', e => {
    if (!enregistrement) return;
    const k = (e.key || '').toLowerCase();
    if (!k || k === 'escape' || k === 'enter' || k.startsWith('arrow') || ['shift', 'control', 'alt', 'meta', 'tab'].includes(k)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (enregistrement.includes(k)) return;
    enregistrement.push(k);
    if (enregistrement.length < 4) { enregistrement.suite(); return; }
    touchesPerso = [...enregistrement];
    enregistrement = null;
    disposition = 'perso';
    A.stock.ecrire('rythme-touches', 'perso'); A.stock.ecrire('rythme-touches-perso', touchesPerso);
    NOMS_TOUCHES = mesTouches().map(nomTouche);
    menuTouches();
  }, true);

  function pause() {
    if (etat !== 'jeu' || !audio) return;
    etat = 'pause';
    audio.suspend();
    A.panneau({ titre: 'Pause', boutons: [{ texte: 'Reprendre', primaire: true, action: () => { A.fermerPanneau(); audio.resume(); etat = 'jeu'; } }, { texte: 'Recommencer', action: () => { audio.resume(); arreterPartie(); lancer(); } }, { texte: 'Menu', action: () => { audio.resume(); menu(); } }] });
  }
  A.surPerteFocus = pause;

  /* ---------- Commandes ---------- */
  // en « capture » : une touche de colonne ne déclenche rien d'autre (par ex. M qui coupe le son, P la pause)
  addEventListener('keydown', e => {
    if (enregistrement) return;
    const v = voieDe(e);
    if (v !== undefined) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (!e.repeat) taper(v);
      return;
    }
    if (e.code === 'Escape' || e.code === 'KeyP') pause();
  }, true);
  T.canvas.addEventListener('pointerdown', e => {
    if (etat !== 'jeu') return;
    const p = T.point(e);
    const v = Math.floor((p.x - LX) / LW);
    if (v >= 0 && v < VOIES && p.y > H * 0.35) { e.preventDefault(); taper(v); }
  });

  /* ---------- Dessin ---------- */
  function dessiner(dt, tGlobal) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b0620'); g.addColorStop(1, '#170a2e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // les voies
    for (let v = 0; v < VOIES; v++) {
      const x = LX + v * LW;
      ctx.fillStyle = v % 2 ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.055)';
      ctx.fillRect(x, 0, LW, H);
      if (appuis[v] > 0) { const gr = ctx.createLinearGradient(0, LIGNE - 220, 0, LIGNE); gr.addColorStop(0, 'transparent'); gr.addColorStop(1, COULEURS[v] + '55'); ctx.fillStyle = gr; ctx.fillRect(x, LIGNE - 220, LW, 220); }
      ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    // la ligne où taper
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(LX, LIGNE - 2, LW * VOIES, 4);
    for (let v = 0; v < VOIES; v++) {
      const x = LX + v * LW + LW / 2;
      ctx.strokeStyle = COULEURS[v]; ctx.lineWidth = appuis[v] > 0 ? 6 : 3;
      ctx.beginPath(); ctx.arc(x, LIGNE, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = appuis[v] > 0 ? COULEURS[v] : 'rgba(255,255,255,.5)'; ctx.font = `800 14px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (!A.TACTILE) ctx.fillText(NOMS_TOUCHES[v], x, LIGNE + 50);
      appuis[v] = Math.max(0, appuis[v] - dt);
    }
    if (etat === 'jeu' || etat === 'pause' || etat === 'fin') {
      const t = tempsChanson();
      const vitesse = LIGNE / chute;
      for (const n of notes) {
        if (n.etat) continue;
        const y = LIGNE - (n.t - t) * vitesse;
        if (y < -40) break;
        // trop tard : raté
        if ((t - n.t) * 1000 > FENETRES[FENETRES.length - 1][0] && etat === 'jeu') { n.etat = 2; combo = 0; compte[3]++; message = { texte: 'RATÉ', couleur: '#f87171', t: 0.4 }; continue; }
        const x = LX + n.v * LW + 10;
        ctx.fillStyle = COULEURS[n.v]; ctx.shadowColor = COULEURS[n.v]; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.roundRect(x, y - 13, LW - 20, 26, 10); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x + 8, y - 9, LW - 36, 4);
      }
      // éclats
      eclats = eclats.filter(e => (e.t -= dt) > 0);
      for (const e of eclats) { ctx.strokeStyle = e.c; ctx.globalAlpha = e.t / 0.3; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(LX + e.v * LW + LW / 2, LIGNE, 28 + (0.3 - e.t) * 120, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
      // score, combo, progression
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#fff'; ctx.font = `800 26px ${MONO}`; ctx.fillText(A.format(score), 18, 44);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = `600 11px ${MONO}`; ctx.fillText(PISTES[choix].titre.toUpperCase().slice(0, 34), 18, 62);
      if (combo >= 5) { ctx.textAlign = 'center'; ctx.fillStyle = combo >= 50 ? '#facc15' : '#fff'; ctx.font = `900 ${combo >= 50 ? 40 : 32}px ${MONO}`; ctx.fillText(combo + '×', W / 2, H * 0.32); ctx.font = `700 12px ${MONO}`; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText('COMBO', W / 2, H * 0.32 + 18); }
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(18, 72, W - 36, 4);
      ctx.fillStyle = '#a78bfa'; ctx.fillRect(18, 72, (W - 36) * Math.max(0, Math.min(1, t / Math.max(1, duree))), 4);
      if (message && message.t > 0) { ctx.globalAlpha = Math.min(1, message.t * 3); ctx.textAlign = 'center'; ctx.fillStyle = message.couleur; ctx.font = `900 28px ${POLICE}`; ctx.fillText(message.texte, W / 2, LIGNE - 70); ctx.globalAlpha = 1; message.t -= dt; }
      if (t < 0 && etat === 'jeu') { ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = `900 70px ${MONO}`; ctx.fillText(String(Math.ceil(-t)), W / 2, H * 0.45); }
      if (etat === 'jeu' && duree && t > duree + 0.5) fin();
    }
  }

  A.boutonsCoin(pause);
  menu();
  A.boucle((dt, t) => dessiner(dt, t));
  window.__rythme = { get notes() { return notes; }, get etat() { return etat; }, get score() { return score; }, taper, temps: tempsChanson };
})();
</script>
</body>
</html>
