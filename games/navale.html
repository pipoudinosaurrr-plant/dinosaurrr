<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bataille navale</title>
  <link rel="stylesheet" href="jeu.css">
  <link rel="stylesheet" href="multi/salon.css">
  <style>
    #jeu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 54px 12px 16px; overflow-y: auto; }
    #jeu[hidden] { display: none; }
    .tete { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .statut { min-height: 22px; color: var(--doux); font-size: 14px; text-align: center; }
    .statut b { color: #fff; }

    .mers { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 18px; width: 100%; }
    .mer { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .mer h3 { margin: 0; color: var(--tres-doux); font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; }

    .grille { --t: 30px; display: grid; grid-template-columns: repeat(11, var(--t)); grid-auto-rows: var(--t); }
    .grille.grande { --t: min(36px, calc((100vw - 40px) / 11), calc((100vh - 260px) / 11)); }
    .grille.petite { --t: min(20px, calc((100vw - 40px) / 11)); }
    .grille .lbl { display: grid; place-items: center; color: #4a4a4a; font: 500 calc(var(--t) * .36) var(--mono); }
    .grille .c { position: relative; padding: 0; border: 1px solid #0d2235; background: #071522; cursor: default; }
    .grille.cible.mon-tour .c[data-e="0"] { cursor: crosshair; }
    .grille.cible.mon-tour .c[data-e="0"]:hover { background: #0e2c45; }
    .c.bateau { background: #3f4a55; border-color: #56626e; }
    .c[data-e="1"]::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: #5b7a94; }
    .c[data-e="2"] { background: #3a1a12; }
    .c[data-e="2"]::after, .c[data-e="3"]::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: #f97316; font: 700 calc(var(--t) * .62) var(--police); }
    .c[data-e="3"] { background: #6b1d10; border-color: #8a2a15; }
    .c[data-e="3"]::after { color: #fff; }
    .c.dernier { box-shadow: inset 0 0 0 2px #fff; }
    .c.revele { background: #2a3540; }

    .boutons { display: flex; gap: 8px; }
    .flottille { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; color: var(--tres-doux); font: 500 11px var(--mono); }
    .flottille span { padding: 3px 8px; border: 1px solid var(--bord2); border-radius: 999px; }
    .flottille span.coule { text-decoration: line-through; opacity: .45; }
  </style>
</head>
<body>
  <main id="jeu" hidden>
    <div class="tete" id="tete"></div>
    <div class="statut" id="statut"></div>
    <div class="mers" id="mers"></div>
  </main>

  <script src="../assets/config.js"></script>
  <script type="module">
    import { demarrerJeu, echapper, TACTILE } from './multi/salon.js';
    import moteur, { N, BATEAUX } from './multi/jeux/navale.js';

    const NOMS = { 5: 'Porte-avions', 4: 'Croiseur', 3: 'Sous-marin', 2: 'Torpilleur' };
    const LETTRES = 'ABCDEFGHIJ';
    let vue = null, ctxJeu = null, dernierTir = '';

    function grille(classe, etats, bateaux, dernier, revele) {
      const surBateau = new Set((bateaux || []).flatMap(b => b.cases.map(([r, c]) => r * N + c)));
      const reveles = new Set((revele || []).flatMap(b => b.cases.map(([r, c]) => r * N + c)));
      let html = `<div class="grille ${classe}"><span></span>`;
      for (let c = 0; c < N; c++) html += `<span class="lbl">${c + 1}</span>`;
      for (let r = 0; r < N; r++) {
        html += `<span class="lbl">${LETTRES[r]}</span>`;
        for (let c = 0; c < N; c++) {
          const k = r * N + c;
          const cls = ['c', surBateau.has(k) ? 'bateau' : '', reveles.has(k) && etats[k] < 2 ? 'revele' : '', dernier === k ? 'dernier' : ''].join(' ');
          html += `<button class="${cls}" data-k="${k}" data-e="${etats ? etats[k] : 0}" aria-label="${LETTRES[r]}${c + 1}"></button>`;
        }
      }
      return html + '</div>';
    }

    function coulesParTaille(bateaux) {
      const tailles = bateaux.filter(b => b.coule).map(b => b.cases.length);
      return BATEAUX.map(t => { const i = tailles.indexOf(t); if (i < 0) return false; tailles.splice(i, 1); return true; });
    }

    function afficher(v, ctx) {
      vue = v; ctxJeu = ctx;
      const mi = v.moi;
      const lui = mi < 0 ? 1 : 1 - mi;
      const monTour = !v.fini && v.phase === 'tir' && v.tour === mi;

      document.getElementById('tete').innerHTML = v.j.map((id, i) => `
        <span class="pastille-joueur${v.phase === 'tir' && !v.fini && v.tour === i ? ' actif' : ''}"><i style="background:${ctx.couleur(id)}"></i>${echapper(ctx.nom(id))}${id === ctx.moi ? ' (toi)' : ''} <b>${v.restants[i]}</b></span>`).join('');

      let s;
      if (v.fini) s = v.gagnant === mi ? '<b>Victoire !</b> Toute la flotte ennemie est coulée.' : `<b>${echapper(ctx.nom(v.j[v.gagnant]))}</b> a coulé toute la flotte.`;
      else if (v.phase === 'placement') s = mi < 0 ? 'Les capitaines placent leurs bateaux…' : v.prets[mi] ? `En attente de ${echapper(ctx.nom(v.j[lui]))}…` : '<b>Place ta flotte.</b> Mélange jusqu’à ce qu’elle te plaise, puis valide.';
      else if (monTour) s = `<b>À toi de tirer.</b> ${TACTILE ? 'Touche' : 'Clique'} une case de la mer ennemie.`;
      else s = `${echapper(ctx.nom(v.j[v.tour]))} vise…`;
      document.getElementById('statut').innerHTML = s;

      const mers = document.getElementById('mers');
      const flottille = (flotte, coules) => `<div class="flottille">${BATEAUX.map((t, i) => `<span class="${coules[i] ? 'coule' : ''}">${NOMS[t]}</span>`).join('')}</div>`;
      if (v.phase === 'placement' && mi >= 0) {
        mers.innerHTML = `
          <div class="mer">
            <h3>Ta flotte</h3>
            ${grille('grande', Array(N * N).fill(0), v.flotte)}
            <div class="boutons">
              <button class="btn" data-n="melanger" ${v.prets[mi] ? 'disabled' : ''}>Mélanger</button>
              <button class="btn primaire" data-n="pret" ${v.prets[mi] ? 'disabled' : ''}>${v.prets[mi] ? 'Prêt ✓' : 'Je suis prêt'}</button>
            </div>
          </div>`;
        return;
      }
      const dernierLui = v.dernier && v.dernier.par === mi ? v.dernier.k : -1;
      const dernierMoi = v.dernier && v.dernier.par !== mi ? v.dernier.k : -1;
      mers.innerHTML = `
        <div class="mer">
          <h3>Mer de ${echapper(ctx.nom(v.j[lui]))}</h3>
          ${grille(`grande cible${monTour ? ' mon-tour' : ''}`, v.mesTirs, [], dernierLui, v.adverse)}
          ${flottille(null, coulesParTaille(v.adverse))}
        </div>
        <div class="mer">
          <h3>${mi < 0 ? 'Mer de ' + echapper(ctx.nom(v.j[0])) : 'Ta flotte'}</h3>
          ${grille('petite', v.sesTirs, v.flotte, dernierMoi)}
        </div>`;

      if (v.dernier) {
        const cle = `${v.dernier.par}:${v.dernier.k}`;
        if (cle !== dernierTir) {
          dernierTir = cle;
          const parMoi = v.dernier.par === mi;
          const r = v.dernier.resultat;
          const texte = r === 'eau' ? 'À l’eau.' : r === 'touche' ? 'Touché !' : `Coulé ! (${NOMS[v.dernier.taille]})`;
          if (r !== 'eau' || parMoi) ctx.toast((parMoi ? '' : ctx.nom(v.j[v.dernier.par]) + ' : ') + texte, 1500);
        }
      }
    }

    document.getElementById('mers').addEventListener('click', e => {
      const n = e.target.closest('[data-n]');
      if (n && !n.disabled) { ctxJeu.envoyer({ t: n.dataset.n }); return; }
      const c = e.target.closest('.cible.mon-tour .c');
      if (c && c.dataset.e === '0') ctxJeu.envoyer({ t: 'tir', k: Number(c.dataset.k) });
    });

    demarrerJeu({
      id: 'navale',
      moteur,
      zone: document.getElementById('jeu'),
      titre: 'Bataille navale',
      intro: 'Place ta flotte, puis tire chacun votre tour dans la mer de l’autre. Le premier qui coule les 5 bateaux adverses gagne.',
      regles: [['Placer', 'Mélange tes bateaux, puis valide.'], ['Tirer', 'Une case par tour.'], ['Couler', 'Les 5 bateaux adverses.']],
      debut() { dernierTir = ''; },
      afficher
    });
  </script>
</body>
</html>
