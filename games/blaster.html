<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blaster</title>
  <link rel="stylesheet" href="jeu.css">
  <style>
    html, body { overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="jeu" aria-label="Blaster : shooter spatial"></canvas>
  <script src="arcade.js"></script>
<script>
(() => {
  'use strict';
  const A = window.Arcade;
  const W = 480, H = 720;
  const T = A.toile(document.getElementById('jeu'), { largeur: W, hauteur: H, pixel: true });
  const ctx = T.ctx;
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const { hasard, borne } = A;

  /* ==========================================================
     Les sprites (pixel art, agrandis ×3)
     ========================================================== */
  const P = 3;
  const sp = (lignes, coul) => A.sprite(lignes, coul, P);
  const IMG = {
    joueur: sp([
      '......G......',
      '.....GGG.....',
      '.....GWG.....',
      '....GGWGG....',
      '....GGGGG....',
      '...GGGGGGG...',
      '..GGDGGGDGG..',
      '.GGGDGGGDGGG.',
      'GGG.DGGGD.GGG',
      'GG...GGG...GG',
      'G...........G'
    ], { G: '#22c55e', D: '#14532d', W: '#e0f2fe' }),
    abeille: sp([
      '.R.......R.',
      '..R.....R..',
      '.RRRRRRRRR.',
      'RRYRRRRRYRR',
      'RRRRRRRRRRR',
      '.RR.RRR.RR.',
      '.R...R...R.',
      '.....R.....'
    ], { R: '#ef4444', Y: '#fde047' }),
    zigzag: sp([
      '....VVV....',
      '..VVVVVVV..',
      '.VVWVVVWVV.',
      'VVVVVVVVVVV',
      'V.V.V.V.V.V',
      '...V...V...'
    ], { V: '#a855f7', W: '#f5d0fe' }),
    tireur: sp([
      '....CCCCC....',
      '...CWWWWWC...',
      '..CCCCCCCCC..',
      'BBBBBBBBBBBBB',
      '.BYBBYBBYBBY.',
      '..BBBBBBBBB..',
      '....B...B....'
    ], { C: '#7dd3fc', W: '#e0f2fe', B: '#2563eb', Y: '#fde047' }),
    kamikaze: sp([
      'O.........O',
      'OO.......OO',
      '.OOO...OOO.',
      '.OOOOOOOOO.',
      '..OOWWWOO..',
      '...OOOOO...',
      '....OOO....',
      '.....O.....'
    ], { O: '#f59e0b', W: '#fff7ed' }),
    tank: sp([
      '...GGGGGGGGGGG...',
      '..GLLLLLLLLLLLG..',
      '.GLGGGGGGGGGGGLG.',
      'GGLGRRGGGGGRRGLGG',
      'GGLGRRGGGGGRRGLGG',
      'GGLGGGGWWWGGGGLGG',
      'GGLGGGGWWWGGGGLGG',
      '.GLGGGGGGGGGGGLG.',
      '..GLLLLLLLLLLLG..',
      '...GGG.GGG.GGG...',
      '....G...G...G....'
    ], { G: '#64748b', L: '#94a3b8', R: '#ef4444', W: '#fde047' })
  };
  // le boss : grand vaisseau dessiné à la main
  IMG.boss = (() => {
    const c = document.createElement('canvas');
    c.width = 150; c.height = 96;
    const g = c.getContext('2d');
    const r = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    r('#3f3f46', 15, 21, 120, 45); r('#52525b', 27, 12, 96, 15); r('#71717a', 45, 6, 60, 9);
    r('#27272a', 0, 36, 30, 36); r('#27272a', 120, 36, 30, 36);
    r('#dc2626', 6, 60, 12, 21); r('#dc2626', 132, 60, 12, 21);
    r('#7f1d1d', 60, 66, 30, 24); r('#ef4444', 66, 78, 18, 15);
    r('#fde047', 36, 33, 15, 9); r('#fde047', 99, 33, 15, 9);
    r('#a855f7', 63, 24, 24, 18); r('#f5d0fe', 69, 27, 6, 6);
    for (let x = 21; x < 130; x += 12) r('#18181b', x, 51, 6, 6);
    return c;
  })();
  const BONUS = {
    P: { coul: '#22c55e', lettre: 'P' }, B: { coul: '#f97316', lettre: 'B' },
    S: { coul: '#38bdf8', lettre: 'S' }, V: { coul: '#f43f5e', lettre: '♥' }
  };

  /* ==========================================================
     État
     ========================================================== */
  let etat = 'menu';  // menu, jeu, pause, fin
  let joueur, tirs, ennemis, balles, bonus, particules, textes, etoiles;
  let score, vague, vies, bombes, combo, comboT, tempsVague, fileVague, banniere, secousse, flash, tirT, finT;
  let pointeur = null, glisse = null, toucheActive = false;
  let record = A.record('blaster-score') || 0;

  function nouvellePartie() {
    joueur = { x: W / 2, y: H - 110, arme: 1, bouclier: 0, invincible: 2, vivant: true };
    tirs = []; ennemis = []; balles = []; bonus = []; particules = []; textes = [];
    score = 0; vague = 0; vies = 3; bombes = 2; combo = 1; comboT = 0; secousse = 0; flash = 0; tirT = 0; finT = 0;
    fileVague = []; banniere = null;
    vagueSuivante();
  }

  function initEtoiles() {
    etoiles = [];
    for (let i = 0; i < 110; i++) etoiles.push({ x: Math.random(), y: Math.random(), v: hasard(0.02, 0.18), t: Math.random() < 0.15 ? 2 : 1 });
  }

  /* ==========================================================
     Les vagues
     ========================================================== */
  function vagueSuivante() {
    vague++;
    const boss = vague % 5 === 0;
    banniere = { texte: boss ? '⚠ BOSS ⚠' : 'VAGUE ' + vague, t: 2.2 };
    if (boss) A.son('boss');
    fileVague = [];
    const d = 1 + (vague - 1) * 0.12;   // difficulté
    let t = 1.6;
    const ajouter = (dt, f) => { t += dt; fileVague.push({ t, f }); };
    if (boss) {
      ajouter(0.5, () => creerBoss(d));
    } else {
      const groupes = 3 + Math.min(6, Math.floor(vague / 2));
      for (let g = 0; g < groupes; g++) {
        const type = choisirType();
        if (type === 'abeille') {
          const n = 5 + Math.min(4, vague);
          const cote = Math.random() < 0.5;
          for (let i = 0; i < n; i++) ajouter(0.18, () => creer('abeille', cote ? 60 + i * 36 : W - 60 - i * 36, -20, d));
        } else if (type === 'zigzag') {
          for (let i = 0; i < 5; i++) ajouter(0.3, () => creer('zigzag', W / 2, -20, d, { phase: i * 0.6 }));
        } else if (type === 'tireur') {
          const n = 2 + Math.min(3, Math.floor(vague / 3));
          for (let i = 0; i < n; i++) ajouter(0.4, () => creer('tireur', 70 + (W - 140) * (i + 0.5) / n, -20, d));
        } else if (type === 'kamikaze') {
          for (let i = 0; i < 3 + Math.min(4, Math.floor(vague / 2)); i++) ajouter(0.35, () => creer('kamikaze', hasard(40, W - 40), -20, d));
        } else if (type === 'tank') {
          ajouter(0.3, () => creer('tank', hasard(100, W - 100), -30, d));
        }
        t += 1.4;
      }
    }
    tempsVague = 0;
  }

  function choisirType() {
    const choix = ['abeille', 'abeille', 'zigzag'];
    if (vague >= 2) choix.push('tireur', 'kamikaze');
    if (vague >= 3) choix.push('tank', 'tireur');
    if (vague >= 6) choix.push('kamikaze', 'tank');
    return choix[Math.floor(Math.random() * choix.length)];
  }

  const STATS = {
    abeille: { pv: 1, r: 14, points: 100, vy: 140 },
    zigzag: { pv: 2, r: 14, points: 150, vy: 110 },
    tireur: { pv: 4, r: 18, points: 300, vy: 120 },
    kamikaze: { pv: 1, r: 12, points: 200, vy: 90 },
    tank: { pv: 22, r: 26, points: 1000, vy: 40 }
  };

  function creer(type, x, y, d, extra = {}) {
    const s = STATS[type];
    ennemis.push(Object.assign({
      type, x, y, x0: x, t: 0, pv: Math.ceil(s.pv * (type === 'tank' ? d : Math.min(d, 2.2))), pvMax: 0, r: s.r, points: s.points,
      vy: s.vy * Math.min(1.6, 0.9 + d * 0.1), tirT: hasard(0.8, 2), flash: 0, d
    }, extra));
    ennemis[ennemis.length - 1].pvMax = ennemis[ennemis.length - 1].pv;
  }

  function creerBoss(d) {
    const pv = Math.round(190 * d);
    ennemis.push({ type: 'boss', x: W / 2, y: -80, t: 0, pv, pvMax: pv, r: 60, points: 10000, flash: 0, tirT: 1.5, motif: 0, d, entree: true });
  }

  /* ==========================================================
     Tirs
     ========================================================== */
  function tirer() {
    const x = joueur.x, y = joueur.y - 18;
    const t = (vx, vy, dx = 0, deg = 1) => tirs.push({ x: x + dx, y, vx, vy, deg });
    const a = joueur.arme;
    if (a === 1) t(0, -720);
    if (a === 2) { t(0, -720, -7); t(0, -720, 7); }
    if (a === 3) { t(0, -720); t(-110, -700, -6); t(110, -700, 6); }
    if (a === 4) { t(0, -720, -7); t(0, -720, 7); t(-160, -690, -9); t(160, -690, 9); }
    if (a >= 5) { t(0, -740, -7); t(0, -740, 7); t(-130, -700, -9); t(130, -700, 9); t(-260, -650, -12, 1); t(260, -650, 12, 1); }
    A.son('tir');
  }

  function balle(x, y, angle, v, coul = '#fb7185', taille = 5) {
    balles.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, coul, r: taille });
  }
  const versJoueur = e => Math.atan2(joueur.y - e.y, joueur.x - e.x);

  /* ==========================================================
     Mise à jour
     ========================================================== */
  function explosion(x, y, n = 18, coul = ['#fde047', '#f97316', '#ef4444', '#fff']) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = hasard(40, 260);
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: hasard(0.3, 0.8), t: 0, coul: coul[i % coul.length], taille: hasard(2, 5) });
    }
  }

  function texteFlottant(x, y, t, coul = '#fff') { textes.push({ x, y, t, coul, vie: 0.9 }); }

  function toucherEnnemi(e, deg) {
    e.pv -= deg;
    e.flash = 0.06;
    if (e.pv > 0) return;
    e.mort = true;
    const pts = e.points * combo;
    score += pts;
    combo = Math.min(8, combo + (e.type === 'boss' ? 0 : 0.25));
    comboT = 1.6;
    texteFlottant(e.x, e.y, '+' + A.format(pts), combo >= 2 ? '#facc15' : '#fff');
    if (e.type === 'boss') {
      for (let i = 0; i < 8; i++) setTimeout(() => { explosion(e.x + hasard(-60, 60), e.y + hasard(-30, 30), 30); A.son('explosion'); }, i * 120);
      secousse = 1; flash = 0.4;
      lacherBonus(e.x - 30, e.y, 'P'); lacherBonus(e.x + 30, e.y, 'V'); lacherBonus(e.x, e.y + 20, 'B');
      balles = [];
    } else {
      explosion(e.x, e.y, e.type === 'tank' ? 40 : 16);
      A.son(e.type === 'tank' ? 'explosion' : 'petite');
      if (e.type === 'tank') { secousse = 0.4; lacherBonus(e.x, e.y, Math.random() < 0.5 ? 'P' : 'S'); }
      else {
        const p = Math.random();
        if (p < 0.045) lacherBonus(e.x, e.y, 'P');
        else if (p < 0.06) lacherBonus(e.x, e.y, 'B');
        else if (p < 0.075) lacherBonus(e.x, e.y, 'S');
        else if (p < 0.08) lacherBonus(e.x, e.y, 'V');
      }
    }
  }

  function lacherBonus(x, y, type) { bonus.push({ x, y, type, t: 0 }); }

  function bombe() {
    if (bombes <= 0 || !joueur.vivant) return;
    bombes--;
    flash = 0.5; secousse = 0.6;
    A.son('explosion');
    for (const b of balles) explosion(b.x, b.y, 2, ['#fff', '#fde047']);
    balles = [];
    for (const e of ennemis) if (e.y > -20) toucherEnnemi(e, e.type === 'boss' ? 30 : 25);
    joueur.invincible = Math.max(joueur.invincible, 1);
  }

  function blesser() {
    if (joueur.invincible > 0 || !joueur.vivant) return;
    if (joueur.bouclier > 0) {
      joueur.bouclier = 0; joueur.invincible = 1.2;
      A.son('touche'); explosion(joueur.x, joueur.y, 14, ['#38bdf8', '#e0f2fe']);
      return;
    }
    vies--;
    explosion(joueur.x, joueur.y, 40, ['#22c55e', '#fde047', '#fff', '#f97316']);
    A.son('explosion');
    secousse = 0.7;
    balles = [];
    if (vies <= 0) {
      joueur.vivant = false;
      finT = 1.6;
      return;
    }
    joueur.arme = Math.max(1, joueur.arme - 1);
    joueur.invincible = 2.4;
    combo = 1;
  }

  function majJoueur(dt) {
    const k = A.touches;
    const v = 330;
    let dx = (k.droite ? 1 : 0) - (k.gauche ? 1 : 0), dy = (k.bas ? 1 : 0) - (k.haut ? 1 : 0);
    if (dx || dy) {
      const n = Math.hypot(dx, dy);
      joueur.x += dx / n * v * dt; joueur.y += dy / n * v * dt;
      pointeur = null;
    } else if (pointeur && !A.TACTILE) {
      // la souris : le vaisseau va vers le pointeur
      const ex = pointeur.x - joueur.x, ey = pointeur.y - joueur.y, dist = Math.hypot(ex, ey);
      const pas = Math.min(dist, 700 * dt);
      if (dist > 0.5) { joueur.x += ex / dist * pas; joueur.y += ey / dist * pas; }
    }
    joueur.x = borne(joueur.x, 18, W - 18);
    joueur.y = borne(joueur.y, 40, H - 24);
    tirT -= dt;
    if (tirT <= 0) { tirer(); tirT = joueur.arme >= 4 ? 0.1 : 0.115; }
    joueur.invincible = Math.max(0, joueur.invincible - dt);
    if (A.vient('action') || A.vient('action2')) bombe();
  }

  function majEnnemis(dt) {
    for (const e of ennemis) {
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      const d = e.d;
      switch (e.type) {
        case 'abeille':
          e.y += e.vy * dt;
          e.x = e.x0 + Math.sin(e.t * 2.4) * 40;
          if (vague >= 4) { e.tirT -= dt; if (e.tirT <= 0 && e.y < H * 0.6) { balle(e.x, e.y + 10, versJoueur(e), 170 + d * 15); e.tirT = hasard(2.5, 5) / Math.min(2, d); } }
          break;
        case 'zigzag':
          e.y += e.vy * dt;
          e.x = W / 2 + Math.sin(e.t * 1.7 + e.phase) * (W / 2 - 50);
          break;
        case 'tireur':
          if (e.t < 1.4) e.y += (150 - e.y) * dt * 2.2 + 10 * dt;
          else if (e.t > 7) e.y += 160 * dt;
          e.tirT -= dt;
          if (e.tirT <= 0 && e.t > 1 && e.t < 7) {
            const a = versJoueur(e);
            for (let i = -1; i <= 1; i++) balle(e.x, e.y + 14, a + i * 0.18, 190 + d * 12, '#60a5fa');
            e.tirT = Math.max(0.7, 1.8 - d * 0.15);
          }
          break;
        case 'kamikaze': {
          if (e.t < 0.8) { e.y += 110 * dt; break; }
          if (!e.cible) { const a = versJoueur(e); e.cible = { vx: Math.cos(a), vy: Math.sin(a) }; A.son('laser'); }
          const v = Math.min(520, 160 + e.t * 260);
          e.x += e.cible.vx * v * dt; e.y += e.cible.vy * v * dt;
          break;
        }
        case 'tank':
          e.y += e.vy * dt;
          e.x = e.x0 + Math.sin(e.t * 0.8) * 60;
          e.tirT -= dt;
          if (e.tirT <= 0 && e.y > 20) {
            for (let i = -2; i <= 2; i++) balle(e.x, e.y + 20, Math.PI / 2 + i * 0.22, 160 + d * 10, '#fbbf24', 6);
            e.tirT = Math.max(1, 2.2 - d * 0.12);
          }
          break;
        case 'boss': majBoss(e, dt); break;
      }
      // contact avec le joueur
      if (joueur.vivant && Math.hypot(e.x - joueur.x, e.y - joueur.y) < e.r * 0.75 + 6) {
        blesser();
        if (e.type !== 'boss' && e.type !== 'tank') toucherEnnemi(e, 99);
      }
    }
    ennemis = ennemis.filter(e => !e.mort && e.y < H + 60 && e.x > -80 && e.x < W + 80);
  }

  function majBoss(e, dt) {
    if (e.entree) {
      e.y += (130 - e.y) * dt * 1.5;
      if (e.y > 120) e.entree = false;
      return;
    }
    e.x = W / 2 + Math.sin(e.t * 0.6) * (W / 2 - 90);
    const rage = e.pv < e.pvMax * 0.4;
    e.tirT -= dt;
    if (e.tirT > 0) return;
    const d = e.d;
    e.motif = (e.motif + 1) % 3;
    if (e.motif === 0) {
      // éventail
      const n = rage ? 13 : 9;
      for (let i = 0; i < n; i++) balle(e.x, e.y + 40, Math.PI / 2 + (i - (n - 1) / 2) * 0.16, 170 + d * 8, '#f472b6', 6);
      e.tirT = rage ? 1.1 : 1.5;
    } else if (e.motif === 1) {
      // spirale
      for (let k = 0; k < (rage ? 4 : 3); k++) {
        setTimeout(() => {
          if (e.mort || etat !== 'jeu') return;
          for (let i = 0; i < 10; i++) balle(e.x, e.y + 20, e.t * 2 + i * Math.PI / 5, 150 + d * 6, '#a78bfa', 5);
        }, k * 220);
      }
      e.tirT = rage ? 1.3 : 1.7;
    } else {
      // rafale visée depuis les canons
      for (let k = 0; k < (rage ? 5 : 3); k++) {
        setTimeout(() => {
          if (e.mort || etat !== 'jeu') return;
          balle(e.x - 62, e.y + 30, Math.atan2(joueur.y - e.y - 30, joueur.x - e.x + 62), 260 + d * 10, '#fde047', 5);
          balle(e.x + 62, e.y + 30, Math.atan2(joueur.y - e.y - 30, joueur.x - e.x - 62), 260 + d * 10, '#fde047', 5);
        }, k * 130);
      }
      if (rage && Math.random() < 0.5) creer('kamikaze', hasard(40, W - 40), -20, d);
      e.tirT = rage ? 1 : 1.4;
    }
  }

  function maj(dt) {
    if (etat !== 'jeu') return;
    tempsVague += dt;
    while (fileVague.length && fileVague[0].t <= tempsVague) fileVague.shift().f();
    if (!fileVague.length && !ennemis.length && joueur.vivant && !banniere) {
      vagueSuivante();
      bombes = Math.min(5, bombes + (vague % 5 === 1 ? 1 : 0));
    }
    if (joueur.vivant) majJoueur(dt);
    majEnnemis(dt);

    // tirs du joueur
    for (const t of tirs) {
      t.x += t.vx * dt; t.y += t.vy * dt;
      for (const e of ennemis) {
        if (e.mort || e.entree) continue;
        const rx = e.type === 'boss' ? 70 : e.r, ry = e.type === 'boss' ? 40 : e.r;
        if (Math.abs(t.x - e.x) < rx && Math.abs(t.y - e.y) < ry) {
          t.fini = true;
          toucherEnnemi(e, t.deg);
          particules.push({ x: t.x, y: t.y, vx: hasard(-40, 40), vy: hasard(-80, 0), vie: 0.15, t: 0, coul: '#fde047', taille: 3 });
          break;
        }
      }
    }
    tirs = tirs.filter(t => !t.fini && t.y > -20 && t.x > -20 && t.x < W + 20);

    // balles ennemies
    for (const b of balles) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (joueur.vivant && Math.hypot(b.x - joueur.x, b.y - joueur.y) < b.r + 4) { b.fini = true; blesser(); }
    }
    balles = balles.filter(b => !b.fini && b.y < H + 20 && b.y > -30 && b.x > -20 && b.x < W + 20);

    // bonus
    for (const o of bonus) {
      o.t += dt;
      o.y += 90 * dt;
      o.x += Math.sin(o.t * 3) * 30 * dt;
      // aimant léger
      const dx = joueur.x - o.x, dy = joueur.y - o.y, dist = Math.hypot(dx, dy);
      if (dist < 90 && joueur.vivant) { o.x += dx / dist * 200 * dt; o.y += dy / dist * 200 * dt; }
      if (dist < 24 && joueur.vivant) {
        o.pris = true;
        A.son('bonus');
        if (o.type === 'P') { if (joueur.arme < 5) { joueur.arme++; texteFlottant(o.x, o.y, 'ARME +1', '#4ade80'); } else { score += 2000; texteFlottant(o.x, o.y, '+2 000', '#4ade80'); } }
        if (o.type === 'B') { bombes = Math.min(5, bombes + 1); texteFlottant(o.x, o.y, 'BOMBE +1', '#fb923c'); }
        if (o.type === 'S') { joueur.bouclier = 1; texteFlottant(o.x, o.y, 'BOUCLIER', '#7dd3fc'); }
        if (o.type === 'V') { vies = Math.min(5, vies + 1); texteFlottant(o.x, o.y, 'VIE +1', '#fb7185'); }
      }
    }
    bonus = bonus.filter(o => !o.pris && o.y < H + 20);

    comboT -= dt;
    if (comboT <= 0) combo = Math.max(1, combo - dt * 2);

    if (!joueur.vivant) {
      finT -= dt;
      if (finT <= 0) finir();
    }
  }

  function majEffets(dt) {
    for (const p of particules) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    particules = particules.filter(p => p.t < p.vie);
    for (const t of textes) { t.vie -= dt; t.y -= 40 * dt; }
    textes = textes.filter(t => t.vie > 0);
    for (const e of etoiles) { e.y += e.v * dt * (etat === 'jeu' ? 1.6 : 0.6); if (e.y > 1) { e.y -= 1; e.x = Math.random(); } }
    if (banniere) { banniere.t -= dt; if (banniere.t <= 0) banniere = null; }
    secousse = Math.max(0, secousse - dt * 1.5);
    flash = Math.max(0, flash - dt);
  }

  function finir() {
    etat = 'fin';
    const r = A.record('blaster-score', score);
    A.finPartie('blaster', { score: Math.floor(score) });
    const rv = A.record('blaster-vague', vague);
    record = r.record;
    A.son(r.nouveau ? 'gagne' : 'perdu');
    manette.montrer(false);
    A.panneau({
      pastille: 'Partie terminée',
      titre: r.nouveau ? '🏅 Nouveau record !' : 'Game over',
      lignes: [['Score', A.format(score)], ['Vague atteinte', String(vague)], ['Record', A.format(r.record)], ['Meilleure vague', String(rv.record)]],
      boutons: [{ texte: 'Rejouer', primaire: true, action: lancer }, { texte: 'Menu', action: menu }]
    });
  }

  /* ==========================================================
     Dessin
     ========================================================== */
  function dessiner(t) {
    const dpr = T.effacer('#03030a');
    // étoiles sur tout l'écran (même sur les bandes)
    const cw = T.canvas.width, ch = T.canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const e of etoiles) {
      ctx.fillStyle = e.t === 2 ? '#a5b4fc' : 'rgba(255,255,255,' + (0.25 + e.v * 3) + ')';
      ctx.fillRect(Math.round(e.x * cw), Math.round(e.y * ch), dpr * e.t, dpr * e.t * (1 + e.v * 8));
    }
    T.reset();
    ctx.save();
    if (secousse > 0) ctx.translate(hasard(-5, 5) * secousse, hasard(-5, 5) * secousse);
    // bords de l'aire de jeu
    ctx.strokeStyle = 'rgba(255,255,255,.06)';
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
    // une planète qui passe
    const py = ((t * 8) % (H + 400)) - 200;
    ctx.fillStyle = 'rgba(99,102,241,.12)'; ctx.beginPath(); ctx.arc(W * 0.8, py, 70, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(165,180,252,.08)'; ctx.beginPath(); ctx.arc(W * 0.8 - 18, py - 16, 46, 0, 7); ctx.fill();

    if (etat !== 'menu') {
      // bonus
      for (const o of bonus) {
        const b = BONUS[o.type];
        const pul = 1 + Math.sin(o.t * 8) * 0.1;
        ctx.fillStyle = b.coul; ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(o.x, o.y, 16 * pul, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillRect(o.x - 10, o.y - 10, 20, 20);
        ctx.fillStyle = '#000'; ctx.font = `800 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.lettre, o.x, o.y + 1);
      }
      // ennemis
      for (const e of ennemis) {
        const img = IMG[e.type];
        ctx.save();
        if (e.flash > 0) ctx.filter = 'brightness(3)';
        if (e.type === 'kamikaze' && e.cible) { ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.cible.vy, e.cible.vx) - Math.PI / 2); ctx.drawImage(img, -img.width / 2, -img.height / 2); }
        else ctx.drawImage(img, Math.round(e.x - img.width / 2), Math.round(e.y - img.height / 2));
        ctx.restore();
        if ((e.type === 'tank') && e.pv < e.pvMax) {
          ctx.fillStyle = '#27272a'; ctx.fillRect(e.x - 24, e.y - 28, 48, 4);
          ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - 24, e.y - 28, 48 * e.pv / e.pvMax, 4);
        }
      }
      // tirs
      for (const t2 of tirs) {
        ctx.fillStyle = '#bbf7d0'; ctx.fillRect(t2.x - 2, t2.y - 8, 4, 14);
        ctx.fillStyle = '#22c55e'; ctx.fillRect(t2.x - 1, t2.y - 10, 2, 18);
      }
      // balles ennemies
      for (const b of balles) {
        ctx.fillStyle = b.coul; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, 7); ctx.fill();
      }
      // joueur
      if (joueur.vivant && !(joueur.invincible > 0 && Math.floor(t * 16) % 2)) {
        const img = IMG.joueur;
        // flammes
        ctx.fillStyle = Math.floor(t * 20) % 2 ? '#fde047' : '#f97316';
        ctx.fillRect(joueur.x - 7, joueur.y + 14, 4, 6 + Math.random() * 6);
        ctx.fillRect(joueur.x + 3, joueur.y + 14, 4, 6 + Math.random() * 6);
        ctx.drawImage(img, Math.round(joueur.x - img.width / 2), Math.round(joueur.y - img.height / 2));
        if (joueur.bouclier) {
          ctx.strokeStyle = 'rgba(125,211,252,' + (0.6 + Math.sin(t * 10) * 0.25) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(joueur.x, joueur.y, 28, 0, 7); ctx.stroke();
        }
        // petit point = la zone qui peut être touchée
        ctx.fillStyle = '#fff'; ctx.fillRect(joueur.x - 2, joueur.y - 2, 4, 4);
      }
      // particules
      for (const p of particules) {
        ctx.globalAlpha = 1 - p.t / p.vie;
        ctx.fillStyle = p.coul;
        ctx.fillRect(p.x - p.taille / 2, p.y - p.taille / 2, p.taille, p.taille);
      }
      ctx.globalAlpha = 1;
      for (const x of textes) {
        ctx.globalAlpha = Math.min(1, x.vie * 2);
        ctx.fillStyle = x.coul; ctx.font = `800 14px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(x.t, x.x, x.y);
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
    if (etat !== 'menu') dessinerHUD();
  }

  function dessinerHUD() {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = `800 22px ${MONO}`;
    ctx.fillText(A.format(score), 12, 30);
    ctx.fillStyle = '#a1a1aa'; ctx.font = `600 11px ${MONO}`;
    ctx.fillText('RECORD ' + A.format(Math.max(record, score)), 12, 46);
    if (combo >= 1.25) { ctx.fillStyle = '#facc15'; ctx.font = `800 13px ${MONO}`; ctx.fillText('×' + combo.toFixed(1).replace('.0', ''), 12, 64); }
    ctx.textAlign = 'center'; ctx.fillStyle = '#d4d4d8'; ctx.font = `700 12px ${MONO}`;
    ctx.fillText('VAGUE ' + vague, W / 2, 26);
    // vies et bombes en bas
    ctx.textAlign = 'left';
    for (let i = 0; i < vies; i++) ctx.drawImage(IMG.joueur, 12 + i * 22, H - 26, 13 * 1.4, 11 * 1.4);
    ctx.fillStyle = '#fb923c'; ctx.font = `800 13px ${MONO}`;
    ctx.fillText('BOMBES ' + '●'.repeat(bombes) + '○'.repeat(Math.max(0, 5 - bombes)), 12, H - 34);
    // sur téléphone, le bouton BOMBE est en bas à droite : l'arme s'affiche à gauche
    ctx.textAlign = A.TACTILE ? 'left' : 'right'; ctx.fillStyle = '#4ade80';
    ctx.fillText('ARME ' + '▮'.repeat(joueur.arme) + '▯'.repeat(5 - joueur.arme), A.TACTILE ? 12 : W - 12, A.TACTILE ? H - 54 : H - 12);
    // barre de vie du boss
    const boss = ennemis.find(e => e.type === 'boss');
    if (boss) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(60, 74, W - 120, 10);
      ctx.fillStyle = boss.pv < boss.pvMax * 0.4 ? '#ef4444' : '#a855f7';
      ctx.fillRect(61, 75, (W - 122) * Math.max(0, boss.pv) / boss.pvMax, 8);
    }
    if (banniere) {
      ctx.globalAlpha = Math.min(1, banniere.t * 1.5);
      ctx.textAlign = 'center'; ctx.font = `900 36px ${MONO}`;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(banniere.texte, W / 2 + 2, H * 0.4 + 2);
      ctx.fillStyle = banniere.texte.includes('BOSS') ? '#ef4444' : '#facc15';
      ctx.fillText(banniere.texte, W / 2, H * 0.4);
      ctx.globalAlpha = 1;
    }
  }

  /* ==========================================================
     Contrôles souris / doigt
     ========================================================== */
  const toile = T.canvas;
  toile.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') pointeur = T.point(e);
    else if (glisse && etat === 'jeu') {
      // au doigt : le vaisseau suit le mouvement du doigt (sans être caché dessous)
      const p = T.point(e);
      joueur.x = borne(glisse.jx + (p.x - glisse.x) * 1.3, 18, W - 18);
      joueur.y = borne(glisse.jy + (p.y - glisse.y) * 1.3, 40, H - 24);
    }
  });
  toile.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') {
      if (e.button === 2 || e.button === 1) bombe();
      return;
    }
    if (etat !== 'jeu') return;
    const p = T.point(e);
    // double tape = bombe
    const maintenant = performance.now();
    if (toile._dernier && maintenant - toile._dernier < 280) bombe();
    toile._dernier = maintenant;
    glisse = { x: p.x, y: p.y, jx: joueur.x, jy: joueur.y };
    try { toile.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
  });
  toile.addEventListener('pointerup', () => { glisse = null; });
  toile.addEventListener('pointercancel', () => { glisse = null; });
  toile.addEventListener('contextmenu', e => e.preventDefault());
  toile.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointeur = null; });

  /* ==========================================================
     Menus
     ========================================================== */
  function lancer() {
    A.fermerPanneau();
    nouvellePartie();
    etat = 'jeu';
    manette.montrer(true);
  }
  function menu() {
    etat = 'menu';
    manette.montrer(false);
    const rv = A.record('blaster-vague');
    A.panneau({
      pastille: 'Shooter spatial',
      titre: 'Blaster',
      texte: 'Ton vaisseau tire tout seul. Esquive les tirs, ramasse les bonus et détruis le boss toutes les 5 vagues.',
      lignes: [['Record', A.format(A.record('blaster-score') || 0)], ['Meilleure vague', rv ? String(rv) : '–'],
        ['Bonus', '<span style="color:#22c55e">P</span> arme · <span style="color:#f97316">B</span> bombe · <span style="color:#38bdf8">S</span> bouclier · <span style="color:#f43f5e">♥</span> vie']],
      boutons: [{ texte: 'Jouer', primaire: true, action: lancer }],
      aide: A.TACTILE
        ? 'Glisse le doigt n’importe où pour piloter. Bouton BOMBE (ou double tape) pour tout faire exploser.'
        : 'Souris ou flèches / WASD pour piloter · Espace, Maj ou clic droit : bombe · P : pause · M : son'
    });
  }
  function pause() {
    if (etat !== 'jeu') return;
    etat = 'pause';
    A.panneau({
      titre: 'Pause',
      lignes: [['Score', A.format(score)], ['Vague', String(vague)]],
      boutons: [{ texte: 'Reprendre', primaire: true, action: () => { A.fermerPanneau(); etat = 'jeu'; } }, { texte: 'Recommencer', action: lancer }, { texte: 'Menu', action: menu }]
    });
  }
  A.surPerteFocus = () => { if (etat === 'jeu') pause(); };

  const manette = A.manette([
    { nom: 'action', texte: '<small>BOMBE</small>', classe: 'large', style: 'right:14px;bottom:calc(70px + env(safe-area-inset-bottom));border-color:rgba(249,115,22,.6);color:#fdba74' }
  ]);
  A.boutonsCoin(pause);

  initEtoiles();
  nouvellePartie();
  menu();
  A.boucle((dt, t) => {
    if (A.vient('pause') && !A.panneauOuvert) pause();
    if (etat === 'jeu') maj(dt);
    majEffets(dt);
    dessiner(t);
  });

  window.__blaster = { get etat() { return etat; }, get score() { return score; }, get vague() { return vague; }, get vies() { return vies; }, get ennemis() { return ennemis.length; },
    invincible() { joueur.invincible = 9999; }, vague10() { vague = 9; ennemis = []; fileVague = []; } };
})();
</script>
</body>
</html>
