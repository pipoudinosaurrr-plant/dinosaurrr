<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de pseudo</title>
  <link rel="stylesheet" href="jeu.css">
  <style>
    body {
      min-height: 100%;
      padding: 28px 16px 32px;
      background:
        radial-gradient(600px 300px at 50% -60px, rgba(255, 255, 255, .06), transparent 70%),
        #000;
    }

    main { max-width: 560px; margin: 0 auto; }

    header { margin-bottom: 18px; }
    header .pastille { margin-bottom: 12px; }
    header h1 { font-size: clamp(26px, 6vw, 32px); font-weight: 800; letter-spacing: -.045em; }
    header p { max-width: 440px; margin: 0; color: var(--doux); font-size: 14.5px; }

    form { display: flex; gap: 8px; margin-bottom: 18px; }
    form input { flex: 1; min-width: 0; }
    form .btn { height: 44px; padding: 0 18px; }

    .carte {
      overflow: hidden;
      border: 1px solid var(--bord2);
      border-radius: 16px;
      background: linear-gradient(180deg, #0f0f0f, #080808);
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .04);
      animation: apparition .35s cubic-bezier(.2, .8, .2, 1);
    }

    .carte[hidden] { display: none; }
    @keyframes apparition { from { transform: translateY(8px); opacity: 0; } }

    .carte-tete {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid var(--bord);
      color: var(--tres-doux);
      font: 500 11px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .carte-tete .point { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); vertical-align: 1px; }

    .carte-corps { display: grid; grid-template-columns: 112px 1fr; gap: 18px; padding: 18px 16px; align-items: start; }
    .avatar svg { display: block; width: 112px; height: 112px; border: 1px solid var(--bord2); border-radius: 12px; }

    .pseudo { margin: 0; font: 700 clamp(22px, 6vw, 28px)/1.1 var(--mono); letter-spacing: -.03em; color: #fff; overflow-wrap: anywhere; }
    .role { margin: 6px 0 12px; color: var(--doux); font-size: 13.5px; }
    .rang {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border: 1px solid rgba(34, 197, 94, .35);
      border-radius: 999px;
      background: var(--accent-fond);
      color: var(--accent-clair);
      font: 600 11px var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .stats { display: grid; gap: 9px; margin-top: 16px; }
    .stat { display: grid; grid-template-columns: 76px 1fr 28px; align-items: center; gap: 10px; font-size: 12px; }
    .stat span:first-child { color: var(--doux); }
    .stat .jauge { height: 4px; border-radius: 4px; background: #1c1c1c; overflow: hidden; }
    .stat .jauge i { display: block; height: 100%; border-radius: 4px; background: var(--texte); }
    .stat.fort .jauge i { background: var(--accent); }
    .stat b { font: 500 12px var(--mono); text-align: right; }

    dl { display: grid; grid-template-columns: auto 1fr; gap: 0; margin: 0 16px 16px; border: 1px solid var(--bord); border-radius: 10px; font-size: 13px; }
    dt, dd { padding: 9px 12px; }
    dt { color: var(--tres-doux); font: 500 11px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    dd { margin: 0; }
    dt:not(:first-of-type), dd:not(:first-of-type) { border-top: 1px solid var(--bord); }

    .autres { padding: 0 16px 16px; }
    .autres h3 { margin-bottom: 10px; color: var(--tres-doux); font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .puces { display: flex; flex-wrap: wrap; gap: 6px; }
    .puces button {
      height: 30px;
      padding: 0 11px;
      border: 1px solid var(--bord2);
      border-radius: 8px;
      background: var(--panneau2);
      color: var(--texte);
      font: 12.5px var(--mono);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .puces button:hover { border-color: var(--bord3); background: var(--panneau3); }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--bord); }

    .vide-carte {
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 44px 16px;
      border: 1px dashed var(--bord2);
      border-radius: 16px;
      color: var(--tres-doux);
      text-align: center;
      font-size: 13.5px;
    }
    .vide-carte[hidden] { display: none; }
    .vide-carte svg { width: 30px; height: 30px; color: var(--bord3); }

    @media (max-width: 440px) {
      .carte-corps { grid-template-columns: 1fr; justify-items: center; text-align: center; }
      .carte-corps > div { width: 100%; }
      .stats { width: 100%; text-align: left; }
      form .btn { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="pastille">Outil · Pseudo</span>
      <h1>Générateur de pseudo</h1>
      <p>Écris ton prénom ou un mot que tu aimes. Tu obtiens un pseudo de joueur, avec son avatar et sa carte. Le même mot donne toujours le même résultat.</p>
    </header>

    <form id="formulaire" autocomplete="off">
      <input type="text" id="prenom" maxlength="20" placeholder="Ton prénom…" aria-label="Ton prénom">
      <button class="btn primaire" type="submit">Générer</button>
    </form>

    <div class="vide-carte" id="vide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.7-1.4 1.8-2 3-2s2.3.6 3 2M14 10h4M14 13h3"/></svg>
      Ta carte de joueur apparaîtra ici.
    </div>

    <section class="carte" id="carte" hidden aria-live="polite">
      <div class="carte-tete"><span><span class="point"></span>Carte de joueur</span><span id="numero">#0000</span></div>
      <div class="carte-corps">
        <div class="avatar" id="avatar"></div>
        <div>
          <h2 class="pseudo" id="pseudo"></h2>
          <p class="role" id="role"></p>
          <span class="rang" id="rang"></span>
          <div class="stats" id="stats"></div>
        </div>
      </div>
      <dl id="infos"></dl>
      <div class="autres">
        <h3>Autres idées</h3>
        <div class="puces" id="autres"></div>
      </div>
      <div class="actions">
        <button class="btn" id="copier">Copier le pseudo</button>
        <button class="btn" id="hasard">Prénom au hasard</button>
      </div>
    </section>
  </main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  // Même prénom = même résultat
  function graine(texte) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < texte.length; i++) {
      const c = texte.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761);
      h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    return h1 >>> 0;
  }

  function hasardDepuis(n) {
    return () => {
      n |= 0; n = (n + 0x6d2b79f5) | 0;
      let t = Math.imul(n ^ (n >>> 15), 1 | n);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const PREFIXES = ['Shadow', 'Nova', 'Pixel', 'Turbo', 'Neo', 'Frost', 'Blaze', 'Storm', 'Echo', 'Volt', 'Nyx', 'Zero', 'Hyper', 'Lunar', 'Glitch', 'Cyber', 'Night', 'Iron', 'Ghost', 'Neon'];
  const SUFFIXES = ['Hunter', 'Byte', 'Wolf', 'Fox', 'Rider', 'Strike', 'Core', 'Knight', 'Spark', 'Viper', 'Drift', 'Blade', 'Pulse', 'Falcon', 'Raven', 'Bolt', 'Wave'];
  const ROLES = ['Sniper', 'Stratège', 'Speedrunner', 'Tank', 'Support', 'Éclaireur', 'Chasseur de trophées', 'Pro du parkour', 'Maître du loot', 'Capitaine d’escouade'];
  const GENRES = ['FPS', 'RPG', 'Plateforme', 'Course', 'Puzzle', 'Survie', 'Stratégie', 'Combat', 'Bac à sable', 'Rythme'];
  const PHRASES = ['GG, bien joué.', 'Encore une ?', 'Trop facile.', 'C’était le lag.', 'On recommence ?', 'Victoire.', 'Respawn dans 3… 2… 1…'];
  const RANGS = [[50, 'Bronze'], [60, 'Argent'], [70, 'Or'], [78, 'Platine'], [86, 'Diamant'], [Infinity, 'Légende']];
  const PRENOMS = ['Léa', 'Noah', 'Inès', 'Lucas', 'Chloé', 'Hugo', 'Zoé', 'Adam', 'Jade', 'Rayan', 'Mila', 'Sacha', 'Nina', 'Tom', 'Lina', 'Eden'];
  const TEINTES = [['#ededed', '#22c55e'], ['#22c55e', '#ededed'], ['#a3a3a3', '#ffffff'], ['#ffffff', '#4ade80'], ['#4ade80', '#a3a3a3']];

  const choisir = (alea, liste) => liste[Math.floor(alea() * liste.length)];

  function nettoyer(texte) {
    const simple = texte.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]/g, '');
    const court = simple.slice(0, 10) || 'Player';
    return court.charAt(0).toUpperCase() + court.slice(1).toLowerCase();
  }

  function leet(mot) {
    return mot.replace(/a/gi, '4').replace(/e/gi, '3').replace(/i/gi, '1').replace(/o/gi, '0');
  }

  function pseudos(nom, alea) {
    const p = choisir(alea, PREFIXES);
    const s = choisir(alea, SUFFIXES);
    const p2 = choisir(alea, PREFIXES);
    const s2 = choisir(alea, SUFFIXES);
    const n = Math.floor(alea() * 90) + 10;
    return [
      `${p}${nom}`,
      `${nom}${s}`,
      `${p2}_${s2}${n}`,
      `xX${nom}${s2}Xx`,
      `${leet(nom)}_${s}`,
      `${nom}${n}`
    ];
  }

  // Avatar symétrique 5×5, sobre : blanc / gris / vert sur noir
  function avatar(alea) {
    const [couleur, couleur2] = choisir(alea, TEINTES);
    let cases = '';
    let allumees = 0;
    const grille = [];
    for (let y = 0; y < 5; y++) {
      grille[y] = [];
      for (let x = 0; x < 3; x++) {
        const on = alea() < 0.55;
        grille[y][x] = on;
        if (on) allumees++;
      }
    }
    if (allumees < 4) grille[2][1] = grille[1][2] = grille[3][2] = grille[2][2] = true;
    const special = Math.floor(alea() * 5);
    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 5; x++) {
        const on = grille[y][x < 3 ? x : 4 - x];
        if (!on) continue;
        const c = (x === 2 && y === special) ? couleur2 : couleur;
        cases += `<rect x="${12 + x * 15.2}" y="${12 + y * 15.2}" width="14" height="14" rx="2.5" fill="${c}"/>`;
      }
    }
    return `<svg viewBox="0 0 100 100" role="img" aria-label="Avatar"><rect width="100" height="100" fill="#0b0b0b"/>${cases}</svg>`;
  }

  let pseudoActuel = '';

  function fabriquer(prenomBrut) {
    const prenom = prenomBrut.trim().slice(0, 20);
    if (!prenom) return;
    const n = graine(prenom.toLowerCase());
    const alea = hasardDepuis(n);
    const nom = nettoyer(prenom);
    const idees = pseudos(nom, alea);
    const principal = idees.splice(Math.floor(alea() * idees.length), 1)[0];
    const role = choisir(alea, ROLES);
    const stats = ['Visée', 'Réflexes', 'Stratégie', 'Chance'].map(k => [k, 35 + Math.floor(alea() * 65)]);
    const moyenne = stats.reduce((t, [, v]) => t + v, 0) / stats.length;
    const rang = RANGS.find(r => moyenne < r[0])[1];
    const meilleur = Math.max(...stats.map(([, v]) => v));

    $('avatar').innerHTML = avatar(alea);
    $('pseudo').textContent = principal;
    $('role').textContent = role;
    $('rang').textContent = rang;
    $('numero').textContent = '#' + String(n % 10000).padStart(4, '0');
    $('stats').innerHTML = stats.map(([k, v]) => `<div class="stat${v === meilleur ? ' fort' : ''}"><span>${k}</span><span class="jauge"><i style="width:${v}%"></i></span><b>${v}</b></div>`).join('');
    $('infos').innerHTML = `
      <dt>Genre</dt><dd>${choisir(alea, GENRES)}</dd>
      <dt>Victoire</dt><dd>« ${choisir(alea, PHRASES)} »</dd>`;
    $('autres').innerHTML = idees.slice(0, 4).map(i => `<button type="button">${i}</button>`).join('');

    pseudoActuel = principal;

    const carte = $('carte');
    carte.hidden = true;
    void carte.offsetWidth;
    carte.hidden = false;
    $('vide').hidden = true;
  }

  $('autres').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const ancien = pseudoActuel;
    pseudoActuel = b.textContent;
    $('pseudo').textContent = pseudoActuel;
    b.textContent = ancien;
  });

  $('copier').addEventListener('click', e => {
    const bouton = e.currentTarget;
    const ok = () => { bouton.textContent = 'Copié'; setTimeout(() => { bouton.textContent = 'Copier le pseudo'; }, 1500); };
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(pseudoActuel).then(ok, () => {});
    } catch (err) { /* rien */ }
  });

  $('formulaire').addEventListener('submit', e => {
    e.preventDefault();
    fabriquer($('prenom').value);
  });

  $('hasard').addEventListener('click', () => {
    const p = PRENOMS[Math.floor(Math.random() * PRENOMS.length)];
    $('prenom').value = p;
    fabriquer(p);
  });

  if (window.matchMedia('(hover: hover)').matches) $('prenom').focus();
})();
</script>
</body>
</html>
