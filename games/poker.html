<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poker</title>
  <link rel="stylesheet" href="jeu.css">
  <link rel="stylesheet" href="multi/salon.css">
  <style>
    #jeu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 52px 10px max(12px, env(safe-area-inset-bottom)); background: radial-gradient(900px 520px at 50% 40%, #0f2a1a, #040806 75%); overflow: hidden; }
    #jeu[hidden] { display: none; }
    .table { position: relative; flex: 1; min-height: 0; width: min(100%, 980px); }
    .tapis { position: absolute; left: 9%; right: 9%; top: 14%; bottom: 16%; border-radius: 50% / 46%; background: radial-gradient(ellipse at 50% 40%, #1f7a43, #0f4d29 70%); border: 10px solid #5b3a1c; box-shadow: inset 0 0 0 3px rgba(255,255,255,.08), inset 0 10px 40px rgba(0,0,0,.5), 0 20px 50px rgba(0,0,0,.6); }
    .centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); display: grid; justify-items: center; gap: 8px; }
    .communes { display: flex; gap: 6px; min-height: calc(var(--c) * 1.4); }
    .pot { padding: 3px 12px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fde68a; font: 700 13px var(--mono); }
    .etape { color: rgba(255,255,255,.6); font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }

    /* une carte */
    .table { --c: clamp(28px, 6.4vmin, 58px); }
    .carte-p { position: relative; width: var(--c); height: calc(var(--c) * 1.4); border-radius: calc(var(--c) * .12); background: #fafafa; color: #18181b; box-shadow: 0 4px 10px rgba(0,0,0,.45); font-family: var(--police); display: grid; place-items: center; animation: donne .3s ease both; }
    @keyframes donne { from { transform: translateY(-14px) rotate(-6deg); opacity: 0; } }
    .carte-p.rouge { color: #dc2626; }
    .carte-p .r { position: absolute; top: 4%; left: 9%; font-weight: 800; font-size: calc(var(--c) * .34); line-height: 1; }
    .carte-p .s { font-size: calc(var(--c) * .62); line-height: 1; margin-top: 12%; }
    .carte-p.dos { background: repeating-linear-gradient(45deg, #7f1d1d 0 5px, #991b1b 5px 10px); border: 3px solid #fafafa; }
    .carte-p.vide { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); animation: none; }
    .carte-p.gagne { box-shadow: 0 0 0 3px #facc15, 0 6px 16px rgba(0,0,0,.5); }

    /* les sièges */
    .siege { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; min-width: 96px; transition: opacity .3s; }
    .siege .cartes { display: flex; gap: 3px; --c: clamp(24px, 4.2vmin, 38px); }
    .siege .bulle { display: grid; justify-items: center; padding: 5px 10px; border: 2px solid rgba(255,255,255,.12); border-radius: 12px; background: rgba(0,0,0,.72); min-width: 92px; }
    .siege .nom { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 700; }
    .siege .jetons { color: #fde68a; font: 700 12px var(--mono); }
    .siege .action { min-height: 15px; color: rgba(255,255,255,.65); font-size: 11px; }
    .siege .mise { padding: 1px 8px; border-radius: 999px; background: #facc15; color: #000; font: 800 11px var(--mono); }
    .siege.actif .bulle { border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,.2); }
    .siege.couche { opacity: .45; }
    .siege.elimine { opacity: .25; }
    .siege .donneur { position: absolute; top: -6px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #000; font: 800 10px/20px var(--mono); text-align: center; }
    .siege .chrono { height: 3px; width: 100%; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
    .siege .chrono i { display: block; height: 100%; background: #facc15; }
    .siege .combi { color: #fde047; font-size: 11px; font-weight: 700; }

    .bas { width: min(100%, 720px); min-width: 0; display: grid; gap: 8px; }
    .bas > * { min-width: 0; }
    .infos { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 22px; font-size: 13.5px; color: var(--doux); }
    .infos b { color: #fff; }
    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; min-width: 0; height: 48px; padding: 0 6px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions .btn.danger { border-color: rgba(239,68,68,.5); color: #fca5a5; }
    .actions .btn.or { background: linear-gradient(#fde047, #eab308); color: #3b2a00; border: 0; }
    .relance { display: flex; align-items: center; gap: 10px; }
    .relance input[type=range] { flex: 1; accent-color: #facc15; }
    .relance .montant { min-width: 70px; text-align: right; font: 700 14px var(--mono); color: #fde68a; }
    .raccourcis { display: flex; gap: 6px; }
    .raccourcis button { padding: 4px 9px; border: 1px solid var(--bord2); border-radius: 999px; background: transparent; color: var(--doux); font: 600 12px var(--police); cursor: pointer; }
    .bas[data-attente] .actions, .bas[data-attente] .relance { opacity: .35; pointer-events: none; }
    @media (max-width: 640px) {
      .tapis { left: 3%; right: 3%; top: 12%; bottom: 14%; border-width: 7px; }
      .actions .btn { font-size: 13.5px; height: 46px; }
      .infos { font-size: 12.5px; }
      .siege { min-width: 76px; } .siege .bulle { min-width: 74px; padding: 4px 6px; } .siege .nom { max-width: 80px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <main id="jeu" hidden>
    <div class="table" id="table">
      <div class="tapis"></div>
      <div class="centre"><span class="etape" id="etape"></span><div class="communes" id="communes"></div><span class="pot" id="pot"></span></div>
    </div>
    <div class="bas" id="bas">
      <div class="infos"><span id="statut"></span><span id="maCombi"></span></div>
      <div class="relance"><input type="range" id="curseur" min="0" max="100" step="10"><span class="montant" id="montant"></span></div>
      <div class="raccourcis" id="raccourcis"><button data-x="0.5">½ pot</button><button data-x="1">Pot</button><button data-x="min">Mini</button></div>
      <div class="actions">
        <button class="btn danger" id="btnPasse">Se coucher</button>
        <button class="btn" id="btnSuivre">Suivre</button>
        <button class="btn primaire" id="btnRelance">Relancer</button>
        <button class="btn or" id="btnTapis">Tapis</button>
      </div>
    </div>
  </main>

  <script src="../assets/config.js"></script>
  <script type="module">
    import { demarrerJeu, echapper } from './multi/salon.js';
    import moteur from './multi/jeux/poker.js';

    const $ = id => document.getElementById(id);
    const SYMB = { p: '♠', c: '♥', d: '♦', t: '♣' };
    const RANG = r => (r === 'T' ? '10' : r === 'J' ? 'V' : r === 'Q' ? 'D' : r === 'K' ? 'R' : r);
    const carte = (c, classe = '') => {
      if (!c) return '<div class="carte-p vide"></div>';
      if (c === '?') return '<div class="carte-p dos"></div>';
      return `<div class="carte-p ${'cd'.includes(c[1]) ? 'rouge' : ''} ${classe}"><span class="r">${RANG(c[0])}</span><span class="s">${SYMB[c[1]]}</span></div>`;
    };
    const jetons = n => Number(n || 0).toLocaleString('fr-FR');

    /* ---------- Sons ---------- */
    let audio = null;
    function bip(f, d = 0.06, type = 'triangle', vol = 0.06, retard = 0) {
      try {
        if (localStorage.getItem('site-son') === 'false') return;
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const t = audio.currentTime + retard, o = audio.createOscillator(), g = audio.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + 0.02);
      } catch (e) { /* rien */ }
    }
    const SON = { jeton: () => { bip(1800, 0.03, 'square', 0.03); bip(2400, 0.03, 'square', 0.025, 0.04); }, carte: () => bip(700, 0.04, 'triangle', 0.05), tour: () => bip(880, 0.12, 'sine', 0.06), gagne: () => [523, 659, 784].forEach((f, i) => bip(f, 0.12, 'square', 0.05, i * 0.1)) };

    let vue = null, ctxJeu = null, ancienTour = null, ancienNbCartes = 0, relance = 0, recuA = 0;

    function positions(n, moiIdx) {
      // autour de l'ellipse, moi en bas au milieu
      return Array.from({ length: n }, (_, k) => {
        const rang = (k - moiIdx + n) % n;
        const a = Math.PI / 2 + rang / n * Math.PI * 2;
        const rx = innerWidth < 640 ? 34 : 42;
        return { x: 50 + Math.cos(a) * rx, y: 50 + Math.sin(a) * 40 };
      });
    }

    function afficher(v, ctx) {
      const avant = vue;
      vue = v; ctxJeu = ctx; recuA = Date.now();
      const moiIdx = Math.max(0, v.j.findIndex(j => j.id === ctx.moi));
      const pos = positions(v.j.length, moiIdx);
      const gagnants = new Set(v.resultat ? v.resultat.gagnants : []);
      // les sièges
      document.querySelectorAll('.siege').forEach(el => el.remove());
      v.j.forEach((j, k) => {
        const el = document.createElement('div');
        el.className = 'siege' + (v.tour === j.id ? ' actif' : '') + (j.couche && !j.elimine ? ' couche' : '') + (j.elimine ? ' elimine' : '');
        el.style.left = pos[k].x + '%'; el.style.top = pos[k].y + '%';
        const gain = v.resultat && v.resultat.gains[j.id];
        const combi = v.resultat && v.resultat.combi && v.resultat.combi[j.id];
        el.innerHTML = `
          <div class="cartes">${j.cartes.map(c => carte(c, gagnants.has(j.id) && c !== '?' ? 'gagne' : '')).join('')}</div>
          <div class="bulle" style="border-color:${v.tour === j.id ? '' : ctx.couleur(j.id) + '55'}">
            ${v.donneur === j.id ? '<span class="donneur">D</span>' : ''}
            <span class="nom" style="color:${ctx.couleur(j.id)}">${echapper(ctx.nom(j.id))}${j.id === ctx.moi ? ' (toi)' : ''}</span>
            <span class="jetons">${j.elimine ? 'éliminé' : jetons(j.jetons)}</span>
            ${combi ? `<span class="combi">${echapper(combi)}</span>` : ''}
            <span class="action">${gain ? `<b style="color:#4ade80">+${jetons(gain)}</b>` : echapper(j.derniere || '')}</span>
            ${v.tour === j.id ? `<div class="chrono"><i style="width:${v.reste / 250}%"></i></div>` : ''}
          </div>
          ${j.mise ? `<span class="mise">${jetons(j.mise)}</span>` : ''}`;
        $('table').append(el);
      });
      $('communes').innerHTML = Array.from({ length: 5 }, (_, i) => carte(v.table[i])).join('');
      $('pot').textContent = v.pot ? `Pot : ${jetons(v.pot)}` : `Blindes ${v.petite} / ${v.grosse}`;
      $('etape').textContent = v.etape === 'attente' ? 'Distribution…' : v.etape === 'abattage' ? 'Abattage' : v.etape === 'fin' ? 'Fin' : `Main ${v.main} · ${({ preflop: 'avant le flop', flop: 'flop', tournant: 'tournant', riviere: 'rivière' })[v.etape] || ''}`;
      // sons
      if (v.table.length > ancienNbCartes) SON.carte();
      ancienNbCartes = v.table.length;
      if (v.tour !== ancienTour && v.tour === ctx.moi) SON.tour();
      if (avant && v.pot > avant.pot) SON.jeton();
      ancienTour = v.tour;
      // mes boutons
      const m = v.moi;
      const monTour = v.monTour && m;
      $('bas').toggleAttribute('data-attente', !monTour);
      if (m) {
        $('btnSuivre').textContent = m.aPayer > 0 ? `Suivre ${jetons(Math.min(m.aPayer, m.max))}` : 'Parole';
        $('btnPasse').textContent = m.aPayer > 0 ? 'Se coucher' : 'Se coucher';
        $('btnPasse').disabled = m.aPayer === 0 && false;
        const min = Math.min(m.relanceMin, m.max), max = m.max;
        const c = $('curseur');
        c.min = min; c.max = max; c.step = Math.max(10, v.grosse / 2);
        if (!relance || relance < min || relance > max) relance = min;
        c.value = relance;
        $('montant').textContent = jetons(relance);
        $('btnRelance').disabled = max <= min && m.aPayer >= max;
        $('maCombi').innerHTML = m.combi ? `Ta main : <b>${echapper(m.combi)}</b>` : '';
      }
      const qui = v.tour ? ctx.nom(v.tour) : '';
      $('statut').innerHTML = v.fini ? 'Partie terminée' : v.resultat ? `<b>${v.resultat.gagnants.map(id => echapper(ctx.nom(id))).join(', ')}</b> gagne${v.resultat.gagnants.length > 1 ? 'nt' : ''} le pot` : monTour ? '<b>À toi de jouer !</b>' : qui ? `${echapper(qui)} réfléchit…` : '';
    }
    // le chrono avance entre deux mises à jour
    setInterval(() => {
      if (!vue || !vue.tour) return;
      const el = document.querySelector('.siege.actif .chrono i');
      if (el) el.style.width = Math.max(0, (vue.reste - (Date.now() - recuA)) / 250) + '%';
    }, 200);

    const envoyer = d => { if (ctxJeu) ctxJeu.envoyer(d); };
    $('curseur').addEventListener('input', e => { relance = Number(e.target.value); $('montant').textContent = jetons(relance); });
    $('raccourcis').addEventListener('click', e => {
      const b = e.target.closest('[data-x]');
      if (!b || !vue || !vue.moi) return;
      const m = vue.moi;
      relance = b.dataset.x === 'min' ? m.relanceMin : Math.round((m.relanceMin - m.aPayer + vue.pot * Number(b.dataset.x)) / 10) * 10;
      relance = Math.max(Math.min(m.relanceMin, m.max), Math.min(m.max, relance));
      $('curseur').value = relance; $('montant').textContent = jetons(relance);
    });
    $('btnPasse').onclick = () => envoyer({ t: 'passe' });
    $('btnSuivre').onclick = () => envoyer({ t: 'suivre' });
    $('btnRelance').onclick = () => envoyer({ t: 'relance', montant: relance });
    $('btnTapis').onclick = () => envoyer({ t: 'tapis' });
    addEventListener('keydown', e => {
      if (!vue || !vue.monTour || e.target.matches('input')) return;
      if (e.code === 'KeyF') envoyer({ t: 'passe' });
      if (e.code === 'KeyC' || e.code === 'Space') { e.preventDefault(); envoyer({ t: 'suivre' }); }
      if (e.code === 'KeyR') envoyer({ t: 'relance', montant: relance });
    });

    demarrerJeu({
      id: 'poker',
      moteur,
      zone: $('jeu'),
      titre: 'Poker',
      intro: 'Texas Hold’em avec des jetons virtuels (pas d’argent, juste pour le jeu). Chacun commence avec 1 000 jetons : le dernier qui en a encore gagne. Bluffe… les bots aussi !',
      regles: [['Tes cartes', '2 cartes cachées + 5 cartes communes : fais la meilleure main de 5.'], ['Enchères', 'Se coucher, suivre, relancer ou tapis (F, C, R au clavier).'], ['Combinaisons', 'Paire < double paire < brelan < quinte < couleur < full < carré < quinte flush.']],
      soloBots: 3,
      debut() { ancienTour = null; ancienNbCartes = 0; relance = 0; },
      evenement(ev, ctx) {
        if (ev[0] === 'gagne' && ev[1].includes(ctx.moi)) SON.gagne();
        if (ev[0] === 'blindes') ctx.toast(`Les blindes montent : ${ev[1]} / ${ev[2]}`);
        if (ev[0] === 'elimine') ctx.toast(ev[1] === ctx.moi ? 'Tu n’as plus de jetons…' : `${ctx.nom(ev[1])} est éliminé`);
        if (ev[0] === 'temps' && ev[1] === ctx.moi) ctx.toast('Trop long : tu passes ton tour');
      },
      afficher
    });
  </script>
</body>
</html>
