# Réglages de l'éditeur Pages CMS (app.pagescms.org)
# C'est ici qu'on décrit les champs que tu remplis pour écrire un article.

media:
  input: media
  output: /media
  rename: safe

content:
  - name: articles
    label: Articles du blog
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: categorie
        label: Catégorie
        type: select
        options:
          values: [Annonce, Projets, Jeux, Tech, Tutoriels, Divers]
      - name: resume
        label: Résumé (affiché dans la liste des articles)
        type: text
        options:
          maxlength: 200
      - name: cover
        label: Image de couverture (facultatif)
        type: image
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
