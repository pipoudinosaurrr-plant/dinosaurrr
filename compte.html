<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Mon compte</title>
  <link rel="stylesheet" href="games/jeu.css">
  <style>
    html, body { min-height: 100%; }
    body {
      margin: 0;
      -webkit-user-select: text; user-select: text;
      background:
        radial-gradient(700px 360px at 50% -80px, rgba(255, 255, 255, .06), transparent 70%),
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px) 0 0 / 40px 40px,
        #000;
    }
    main { display: flex; justify-content: center; padding: 20px 16px 40px; }
    .carte { width: 100%; max-width: 440px; padding: 24px; border: 1px solid var(--bord2); border-radius: 18px; background: rgba(8, 8, 8, .9); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .05); }
    h1 { margin: 12px 0 4px; font-size: 30px; font-weight: 800; letter-spacing: -.05em; overflow-wrap: anywhere; }
    h2 { margin: 22px 0 10px; font-size: 15px; letter-spacing: -.01em; }
    .sous { margin: 0 0 18px; color: var(--doux); font-size: 13.5px; line-height: 1.5; }
    .pastille { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border: 1px solid var(--bord2); border-radius: 999px; color: var(--doux); font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .point-vert { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    .onglets { display: flex; gap: 4px; margin: 0 0 18px; padding: 4px; border: 1px solid var(--bord); border-radius: 12px; background: rgba(255, 255, 255, .02); }
    .onglets button { flex: 1; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--doux); font: 600 13px inherit; font-family: inherit; cursor: pointer; }
    .onglets button.actif { background: #fafafa; color: #000; }
    .onglets .pastille-n { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #000; font: 700 10px var(--mono); }

    label { display: block; margin: 12px 0 6px; color: var(--tres-doux); font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    input[type="text"], input[type="password"], select {
      width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--bord2); border-radius: 10px;
      background: rgba(255, 255, 255, .03); color: #fafafa; font: 15px inherit; font-family: inherit; outline: none; box-sizing: border-box;
    }
    input:focus, select:focus { border-color: var(--bord3); box-shadow: 0 0 0 3px rgba(255, 255, 255, .06); }
    select option { background: #111; }
    .aide { margin: 6px 0 0; color: var(--tres-doux); font-size: 12px; line-height: 1.45; }
    .aide.ok { color: var(--accent); }
    .aide.ko { color: #f87171; }
    .btn.grand { width: 100%; height: 46px; margin-top: 16px; border-radius: 11px; font-size: 14.5px; }
    .message { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
    .message.ko { border: 1px solid rgba(239, 68, 68, .35); background: rgba(239, 68, 68, .08); color: #fca5a5; }
    .message.ok { border: 1px solid rgba(34, 197, 94, .35); background: rgba(34, 197, 94, .08); color: #86efac; }
    .message[hidden], [hidden] { display: none !important; }
    .note { margin: 16px 0 0; padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; color: var(--doux); font-size: 12.5px; line-height: 1.5; }

    .chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chiffre { padding: 12px; border: 1px solid var(--bord); border-radius: 12px; background: rgba(255, 255, 255, .02); }
    .chiffre b { display: block; font-size: 24px; letter-spacing: -.03em; }
    .chiffre span { color: var(--tres-doux); font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .lignes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 0; padding: 0; list-style: none; }
    .lignes li { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px 6px 12px; border: 1px solid var(--bord); border-radius: 10px; background: rgba(255, 255, 255, .02); font-size: 14px; }
    .lignes .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lignes .nom small { display: block; color: var(--tres-doux); font-size: 12px; }
    .lignes .vide { justify-content: center; color: var(--tres-doux); font-size: 13px; }
    .lignes .chiffres-jeu { color: var(--doux); font: 500 12px var(--mono); white-space: nowrap; }
    .rond { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #525252; }
    .rond.en-ligne { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .ligne { display: flex; gap: 8px; }
    .ligne > input { flex: 1; min-width: 0; }
    .ligne > .btn { flex: none; height: 44px; }
    .interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--bord); font-size: 14px; }
    .interrupteur small { display: block; color: var(--tres-doux); font-size: 12px; }
    .interrupteur input { flex: none; width: 20px; height: 20px; accent-color: #22c55e; }
    .danger { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--bord); }
    a.lien { color: var(--accent); }
    .onglets button { font-size: 12.5px; padding: 0 2px; }
    .ligne-entete { display: flex; align-items: center; gap: 12px; margin: 10px 0 8px; }
    .ligne-entete h1 { margin: 0 0 2px; }
    .ligne-entete .avatar-dino { flex: none; }
    .niveau { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--doux); }
    .niveau b { color: #fde047; }
    .niveau .xp { font: 500 11.5px var(--mono); color: var(--tres-doux); white-space: nowrap; }
    .barre-xp { height: 8px; margin: 6px 0 16px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .barre-xp i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #22c55e, #fde047); }
    .defi-carte { display: flex; gap: 10px; align-items: center; padding: 12px; margin-bottom: 14px; border: 1px solid rgba(34, 197, 94, .4); border-radius: 12px; background: rgba(34, 197, 94, .07); font-size: 13.5px; }
    .defi-carte.fait { border-color: rgba(250, 204, 21, .5); background: rgba(250, 204, 21, .06); }
    .defi-carte .ico { font-size: 26px; }
    .defi-carte b { display: block; font-size: 11px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--tres-doux); }
    .defi-carte small { display: block; color: var(--tres-doux); font-size: 12px; margin-top: 2px; }
    .grille-succes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .succes { padding: 10px; border: 1px solid var(--bord); border-radius: 12px; background: rgba(255, 255, 255, .02); opacity: .5; }
    .succes.ok { opacity: 1; border-color: rgba(250, 204, 21, .4); background: rgba(250, 204, 21, .05); }
    .succes .ico { font-size: 24px; display: block; }
    .succes b { display: block; font-size: 13px; margin: 4px 0 2px; }
    .succes small { color: var(--tres-doux); font-size: 11.5px; line-height: 1.35; }
    .grille-avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
    .choix-avatar { position: relative; display: grid; place-items: center; padding: 4px; border: 2px solid transparent; border-radius: 12px; background: rgba(255, 255, 255, .03); cursor: pointer; }
    .choix-avatar svg { width: 100%; height: auto; max-width: 52px; }
    .choix-avatar.actif { border-color: #fde047; }
    .choix-avatar.bloque { filter: grayscale(1); opacity: .45; }
    .choix-avatar span { position: absolute; bottom: 2px; left: 0; right: 0; font: 600 9.5px var(--mono); color: #fff; text-shadow: 0 1px 2px #000; }
    .petits-succes { display: flex; flex-wrap: wrap; gap: 6px; font-size: 22px; }
    .onglet-admin { color: #fde047 !important; }
    .onglets .onglet-admin.actif { background: #fde047; color: #000 !important; }
    .bloc-admin { margin-bottom: 8px; }
    .compte-admin { display: block !important; padding: 0 !important; }
    .compte-admin summary { display: flex; align-items: center; min-height: 44px; padding: 6px 12px; cursor: pointer; list-style: none; }
    .compte-admin summary::-webkit-details-marker { display: none; }
    .compte-admin summary::after { content: '▾'; color: var(--tres-doux); margin-left: 8px; }
    .actions-admin { display: grid; gap: 8px; padding: 4px 12px 12px; }
    .actions-admin .ligne > input, .actions-admin .ligne > select { height: 36px; font-size: 13px; padding: 0 9px; }
    .actions-admin .ligne > select { flex: 1.4; min-width: 0; }
    .actions-admin .ligne > .btn { height: 36px; }
    .actions-admin a.btn { justify-self: start; text-decoration: none; }
    .titre-graphe { margin: 14px 0 6px; color: var(--tres-doux); font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .barres { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding-bottom: 16px; }
    .barre { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; }
    .barre i { display: block; width: 100%; min-height: 2px; border-radius: 3px 3px 0 0; background: linear-gradient(#fde047, #22c55e); }
    .barre span { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); color: var(--tres-doux); font: 500 9px var(--mono); white-space: nowrap; }
    .jauge { display: block; height: 4px; margin-top: 4px; border-radius: 3px; background: rgba(255, 255, 255, .06); }
    .jauge i { display: block; height: 100%; border-radius: 3px; background: #22c55e; }
    .compte-admin summary .avatar-dino { flex: none; }
    .badge-rouge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: rgba(239, 68, 68, .2); color: #fca5a5; font: 600 10px var(--mono); vertical-align: middle; }
    button.lien { padding: 0; border: 0; background: none; color: var(--doux); font: inherit; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <main><div class="carte" id="carte"><p class="sous">Chargement…</p></div></main>

  <script src="assets/config.js"></script>
  <script src="assets/jeux.js"></script>
  <script>
  (function () {
    const $ = s => document.querySelector(s);
    const echapper = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const carte = $('#carte');
    const JEUX = window.JEUX || [];
    const titreJeu = id => (JEUX.find(j => j.id === id) || {}).titre || id;
    const date = t => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    function ilYa(t) {
      if (!t) return '';
      const m = Math.round((Date.now() - t) / 60000);
      if (m < 2) return 'à l’instant';
      if (m < 60) return `il y a ${m} min`;
      const h = Math.round(m / 60);
      if (h < 24) return `il y a ${h} h`;
      const j = Math.round(h / 24);
      return j === 1 ? 'hier' : j < 30 ? `il y a ${j} jours` : 'il y a longtemps';
    }

    // le compte et la présence de la page du site (si on est dans une fenêtre du site)
    function parent(nom) { try { return window.parent !== window ? window.parent[nom] : null; } catch (e) { return null; } }
    function chargerScript(src) {
      return new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.append(s); });
    }

    let C = null, P = null, D = null, AV = null;
    let onglet = 'connexion';
    let ongletCompte = 'profil';
    let enLigne = new Set();

    const arrets = [];
    async function demarrer() {
      C = parent('DinoCompte');
      if (!C) { await chargerScript('assets/compte.js'); C = window.DinoCompte; }
      P = parent('DinoPresence');
      AV = parent('DinoAvatar');
      if (!AV) { await chargerScript('assets/avatars.js'); AV = window.DinoAvatar; }
      try { D = await import('./assets/progres-defs.js'); } catch (e) { D = null; }
      const PR = parent('DinoProgres');
      if (PR) arrets.push(PR.ecouter(() => { if (C.connecte && !lireProfil()) { C.moi(); if (['profil', 'succes'].includes(ongletCompte)) afficherCompte(); } }));
      if (!C) { carte.innerHTML = '<p class="sous">Impossible de charger les comptes.</p>'; return; }
      window.addEventListener('pagehide', () => arrets.forEach(f => f()), { once: true });
      if (P) arrets.push(P.ecouter(m => {
        if (m.t !== 'contacts') return;
        enLigne = new Set((m.liste || []).map(x => x.cle));
        if (C.connecte && ongletCompte === 'amis' && !lireProfil()) afficherAmis();
      }));
      let dernier = undefined;
      arrets.push(C.ecouter(c => {
        const etat = c ? c.nom + (c.admin ? '*' : '') + '|' + c.invisible + '|' + c.invitations + '|' + c.avatar + '|' + c.niveau : null;
        if (etat === dernier) { if (c && ongletCompte === 'amis' && !lireProfil()) afficherAmis(); return; }
        const changementPersonne = (dernier ? dernier.split('|')[0] : null) !== (c ? c.nom : null);
        dernier = etat;
        if (changementPersonne || !c) afficher();
        else if (!lireProfil()) majEntete();
      }));
      window.addEventListener('hashchange', afficher);
    }

    const lireProfil = () => { const m = location.hash.match(/^#profil\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; };

    function afficher() {
      const profil = lireProfil();
      if (profil) return afficherProfilPublic(profil);
      if (C.connecte) afficherCompte();
      else afficherAccueil();
    }

    function message(el, texte, ok) {
      el.textContent = texte || '';
      el.className = 'message ' + (ok ? 'ok' : 'ko');
      el.hidden = !texte;
    }

    function occupe(btn, oui, texte) {
      btn.disabled = oui;
      if (oui) { btn.dataset.texte = btn.textContent; btn.textContent = texte || 'Patiente…'; }
      else if (btn.dataset.texte) btn.textContent = btn.dataset.texte;
    }

    /* ---------- Pas connecté : se connecter / créer un compte ---------- */

    function afficherAccueil() {
      const creer = onglet === 'creer';
      carte.innerHTML = `
        <span class="pastille"><span class="point-vert"></span>Compte joueur</span>
        <h1>${creer ? 'Créer un compte' : 'Se connecter'}</h1>
        <p class="sous">${creer ? 'Ton pseudo sera réservé : personne d’autre ne pourra jouer avec. Tes victoires et tes amis sont gardés, sur tous tes appareils.' : 'Retrouve ton pseudo, tes victoires et tes amis.'}</p>
        <div class="onglets" role="tablist">
          <button data-onglet="connexion" class="${creer ? '' : 'actif'}">Se connecter</button>
          <button data-onglet="creer" class="${creer ? 'actif' : ''}">Créer un compte</button>
        </div>
        <form id="formulaire" autocomplete="on">
          <label for="nom">Pseudo</label>
          <input type="text" id="nom" name="username" maxlength="14" autocomplete="username" spellcheck="false" autocapitalize="off" required>
          ${creer ? '<p class="aide" id="aide-nom">3 à 14 caractères : lettres, chiffres, _ . -</p>' : ''}
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" name="password" maxlength="100" autocomplete="${creer ? 'new-password' : 'current-password'}" required>
          ${creer ? `<div id="zone-code" hidden>
            <label for="code">Code propriétaire</label>
            <input type="text" id="code" maxlength="20" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX">
            <p class="aide">Ce pseudo est réservé au propriétaire du site. Avec le code secret, tu crées (ou reprends) le compte « Pipou_Dinosaur ».</p>
          </div>
          <p class="aide">Au moins 6 caractères. Choisis-en un que tu n’utilises nulle part ailleurs.</p>
          <label for="mdp2">Mot de passe (encore)</label>
          <input type="password" id="mdp2" maxlength="100" autocomplete="new-password" required>` : ''}
          <button class="btn primaire grand" type="submit">${creer ? 'Créer mon compte' : 'Se connecter'}</button>
          <p class="message" id="msg" hidden></p>
        </form>
        ${creer ? '<p class="note">Il n’y a pas d’e-mail : <b>si tu oublies ton mot de passe, il ne peut pas être récupéré</b>. Note-le quelque part. Tu pourras le changer quand tu veux.</p>' : ''}`;

      carte.querySelectorAll('[data-onglet]').forEach(b => b.addEventListener('click', () => { onglet = b.dataset.onglet; afficherAccueil(); }));
      const nom = $('#nom');
      try { const ancien = localStorage.getItem('cercle-pseudo'); if (ancien && creer && !/^Joueur\d+$/.test(ancien)) nom.value = ancien; } catch (e) { /* rien */ }

      if (creer) {
        let minuterie = null;
        const aide = $('#aide-nom');
        nom.addEventListener('input', () => {
          clearTimeout(minuterie);
          const v = nom.value.trim();
          if (v.length < 3) { aide.className = 'aide'; aide.textContent = '3 à 14 caractères : lettres, chiffres, _ . -'; return; }
          minuterie = setTimeout(async () => {
            const d = await C.api('existe', { nom: v });
            if (nom.value.trim() !== v || !$('#zone-code')) return;   // (le formulaire a peut-être déjà été envoyé)
            $('#zone-code').hidden = !d.proprio;
            if (d.proprio) { aide.className = 'aide'; aide.textContent = 'Pseudo du propriétaire du site'; }
            else if (d.libre) { aide.className = 'aide ok'; aide.textContent = '✓ Ce pseudo est libre'; }
            else { aide.className = 'aide ko'; aide.textContent = d.existe ? 'Ce pseudo est déjà pris' : 'Ce pseudo n’est pas autorisé (3 à 14 caractères : lettres, chiffres, _ . -)'; }
          }, 350);
        });
      }

      $('#formulaire').addEventListener('submit', async e => {
        e.preventDefault();
        const msg = $('#msg');
        const btn = carte.querySelector('button[type="submit"]');
        if (creer && $('#mdp').value !== $('#mdp2').value) return message(msg, 'Les deux mots de passe ne sont pas pareils.');
        occupe(btn, true);
        const proprio = creer && !$('#zone-code').hidden;
        const d = proprio ? await C.reclamer($('#code').value, $('#mdp').value)
          : creer ? await C.inscription(nom.value.trim(), $('#mdp').value) : await C.connexion(nom.value.trim(), $('#mdp').value);
        occupe(btn, false);
        if (d.erreur) return message(msg, d.erreur);
        ongletCompte = 'profil';
        afficher();
        C.chargerAmis();
      });
    }

    /* ---------- Connecté ---------- */

    function afficherCompte() {
      const c = C.compte;
      const recues = C.amis.filter(a => a.statut === 'recue').length;
      carte.innerHTML = `
        <span class="pastille"><span class="point-vert"></span>${c.invisible ? 'Invisible' : 'En ligne'}</span>
        <div class="entete-compte" id="entete"></div>
        <div class="onglets" role="tablist">
          <button data-o="profil" class="${ongletCompte === 'profil' ? 'actif' : ''}">Profil</button>
          <button data-o="succes" class="${ongletCompte === 'succes' ? 'actif' : ''}">Succès</button>
          <button data-o="amis" class="${ongletCompte === 'amis' ? 'actif' : ''}">Amis${recues ? `<span class="pastille-n">${recues}</span>` : ''}</button>
          <button data-o="reglages" class="${ongletCompte === 'reglages' ? 'actif' : ''}">Réglages</button>
          ${c.admin ? `<button data-o="admin" class="onglet-admin ${ongletCompte === 'admin' ? 'actif' : ''}">⚡ Admin</button>` : ''}
        </div>
        <div id="contenu"></div>`;
      carte.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { ongletCompte = b.dataset.o; afficherCompte(); }));
      majEntete();
      if (ongletCompte === 'profil') afficherStats();
      else if (ongletCompte === 'succes') afficherSucces();
      else if (ongletCompte === 'amis') { afficherAmis(); C.chargerAmis(); }
      else if (ongletCompte === 'admin' && c.admin) afficherAdmin();
      else afficherReglages();
    }

    // avatar, pseudo, niveau et barre d'XP
    function htmlNiveau(c) {
      if (!D) return '';
      const n = c.niveau || D.niveauDe(c.xp || 0);
      const debut = D.xpPourNiveau(n), fin = D.xpPourNiveau(n + 1);
      const pct = Math.max(0, Math.min(100, ((c.xp || 0) - debut) / (fin - debut) * 100));
      return `<div class="niveau"><span><b>Niveau ${n}</b> · ${echapper(D.titreDe(n))}</span><span class="xp">${(c.xp || 0).toLocaleString('fr-FR')} / ${fin.toLocaleString('fr-FR')} XP</span></div>
        <div class="barre-xp"><i style="width:${pct.toFixed(1)}%"></i></div>`;
    }
    function majEntete() {
      const el = $('#entete');
      const c = C.compte;
      if (!el || !c) return;
      el.innerHTML = `<div class="ligne-entete">${AV ? AV.svg(c.avatar, 64, c.nom) : ''}<div style="min-width:0;flex:1"><h1>${echapper(c.nom)}</h1><p class="sous" style="margin:0">Membre depuis le ${date(c.cree)}</p></div></div>${htmlNiveau(c)}`;
    }

    function htmlStats(stats) {
      const parties = stats.reduce((s, x) => s + x.parties, 0);
      const victoires = stats.reduce((s, x) => s + x.victoires, 0);
      return `
        <div class="chiffres">
          <div class="chiffre"><b>${victoires}</b><span>Victoires</span></div>
          <div class="chiffre"><b>${parties}</b><span>Parties</span></div>
          <div class="chiffre"><b>${parties ? Math.round(victoires / parties * 100) : 0}%</b><span>Gagnées</span></div>
        </div>
        <h2>Par jeu</h2>
        <ul class="lignes">${stats.length ? stats.map(s => `

    async function afficherStats() {
      const zone = $('#contenu');
      zone.innerHTML = '<p class="sous">Chargement…</p>';
      const [d, e] = await Promise.all([C.moi(), C.api('progres-etat')]);
      if (!$('#contenu') || ongletCompte !== 'profil') return;
      if (!d || d.erreur) { zone.innerHTML = `<p class="message ko">${echapper((d && d.erreur) || 'Erreur')}</p>`; return; }
      majEntete();
      let defi = '';
      if (e && e.defi) defi = `<div class="defi-carte ${e.defi.fait ? 'fait' : ''}"><span class="ico">${e.defi.fait ? '✅' : '🎯'}</span><span><b>Défi du jour</b>${echapper(e.defi.texte)}<small>${e.defi.fait ? 'Réussi ! Reviens demain.' : `+${D ? D.XP.defi : 100} XP si tu le réussis aujourd’hui`}${e.serie > 1 ? ` · série de ${e.serie} jours 🔥` : ''}</small></span></div>`;
      const recs = (e && e.records || []).filter(r => D && D.CLASSEMENTS[r.jeu]);
      zone.innerHTML = defi + htmlStats(d.stats || [])
        + '<p class="aide" style="margin-top:8px">Victoires : seules les parties en ligne avec au moins 2 vrais joueurs comptent.</p>'
        + `<h2>Mes records</h2><ul class="lignes">${recs.length ? recs.map(r => `<li><span class="nom">${echapper(D.CLASSEMENTS[r.jeu].nom)}</span><span class="chiffres-jeu">${Number(r.score).toLocaleString('fr-FR')}</span></li>`).join('') : '<li class="vide">Joue aux jeux solo pour avoir des records (et entrer dans le Hall of Fame).</li>'}</ul>`
        + (e ? `<p class="aide" style="margin-top:10px">XP des jeux solo aujourd’hui : ${e.xpSoloAujourdhui} / ${D ? D.XP.maxSoloParJour : 300}. Les défis, succès et parties en ligne n’ont pas de limite.</p>` : '');
    }

      const zone = $('#contenu');
      if (!zone) return;
      const amis = C.amis;
      const recues = amis.filter(a => a.statut === 'recue');
      const confirmes = amis.filter(a => a.statut === 'ami').sort((a, b) => (enLigne.has(b.cle) - enLigne.has(a.cle)) || a.nom.localeCompare(b.nom, 'fr'));

      const champ = $('#ajout') ? $('#ajout').value : '';
      zone.innerHTML = `
        <form class="ligne" id="form-ajout">
          <input type="text" id="ajout" maxlength="14" placeholder="Pseudo d’un joueur" autocomplete="off" spellcheck="false" autocapitalize="off">
          <button class="btn primaire" type="submit">Ajouter</button>
        </form>
        <p class="message" id="msg-amis" hidden></p>
        ${recues.length ? `<h2>Demandes reçues</h2><ul class="lignes">${recues.map(a => `
          <li><span class="nom">${echapper(a.nom)}<small>veut être ton ami</small></span>
            <button class="btn petit primaire" data-act="ami-accepter" data-nom="${echapper(a.nom)}">Accepter</button>
            <button class="btn petit" data-act="ami-retirer" data-nom="${echapper(a.nom)}">Refuser</button></li>`).join('')}</ul>` : ''}
        <h2>Mes amis (${confirmes.length})</h2>
        <ul class="lignes">${confirmes.length ? confirmes.map(a => {
          const co = enLigne.has(a.cle);
          return `<li><i class="rond ${co ? 'en-ligne' : ''}"></i>
            <span class="nom"><a class="lien" href="#profil/${encodeURIComponent(a.nom)}">${echapper(a.nom)}</a><small>${co ? 'en ligne' : a.vu ? 'vu ' + ilYa(a.vu) : 'hors ligne'}</small></span>
            <button class="btn petit" data-act="ami-retirer" data-nom="${echapper(a.nom)}" data-confirmer="1">Retirer</button></li>`;

        ${envoyees.length ? `<h2>Demandes envoyées</h2><ul class="lignes">${envoyees.map(a => `
          <li><span class="nom">${echapper(a.nom)}<small>en attente</small></span>
            <button class="btn petit" data-act="ami-retirer" data-nom="${echapper(a.nom)}">Annuler</button></li>`).join('')}</ul>` : ''}`;

        $('#ajout').value = '';

        const d = await C.ami(b.dataset.act, b.dataset.nom);
        if (d.erreur) { b.disabled = false; message($('#msg-amis'), d.erreur); }
        else afficherCompte();

      $('#invisible').addEventListener('change', e => reglage({ invisible: e.target.checked }));
      zone.querySelectorAll('[data-avatar]').forEach(b => b.addEventListener('click', async () => {

        afficher();

    async function chargerStats() {
      const d = await C.api('admin-stats');
      const boite = $('#admin-stats');
      if (!boite) return;
      if (d.erreur) { boite.innerHTML = `<p class="message ko">${echapper(d.erreur)}</p>`; return; }
      const jours = Object.entries(d.jours);
      const maxV = Math.max(1, ...jours.map(([, v]) => v.visites));
      const maxH = Math.max(1, ...d.heures);
      const maxJ = Math.max(1, ...d.jeux.map(x => x[1]));
      const barres = (liste, max, etiquette, valeur) => `<div class="barres">${liste.map((x, i) => `<div class="barre" title="${etiquette(x, i)} : ${valeur(x)}"><i style="height:${Math.round(valeur(x) / max * 100)}%"></i><span>${etiquette(x, i, true)}</span></div>`).join('')}</div>`;
      boite.innerHTML = `
        <div class="chiffres">
          <div class="chiffre"><b>${d.comptes}</b><span>Comptes</span></div>
          <div class="chiffre"><b>${d.actifs}</b><span>Actifs 7 j</span></div>
          <div class="chiffre"><b>${d.nouveaux}</b><span>Nouveaux 7 j</span></div>
        </div>
        <h3 class="titre-graphe">Visites par jour (14 derniers jours)</h3>
        ${barres(jours, maxV, ([j], i, court) => court ? j.slice(8) : j, ([, v]) => v.visites)}
        <h3 class="titre-graphe">Heures de pointe (30 jours)</h3>
        ${barres(d.heures, maxH, (x, i, court) => court ? (i % 3 === 0 ? i + 'h' : '') : i + ' h', x => x)}
        <h3 class="titre-graphe">Jeux les plus joués (30 jours)</h3>
        <ul class="lignes">${d.jeux.length ? d.jeux.slice(0, 12).map(([j, n]) => `<li><span class="nom">${echapper(j === 'cercle' ? 'Le Cercle' : titreJeu(j))}<span class="jauge"><i style="width:${Math.round(n / maxJ * 100)}%"></i></span></span><span class="chiffres-jeu">${n}</span></li>`).join('') : '<li class="vide">Pas encore de parties enregistrées.</li>'}</ul>
        <p class="aide">Une « visite » = une page du site ouverte. Les parties comptent le solo des joueurs connectés et toutes les parties en ligne.</p>`;
    }

    async function chargerSite() {
      const boite = $('#admin-site');
      if (!boite) return;
      const d = await C.api('admin-site');
      if (!$('#admin-site')) return;
      if (d.erreur) { boite.innerHTML = `<p class="message ko">${echapper(d.erreur)}</p>`; return; }
      boite.innerHTML = `
        <div class="chiffres">
          <div class="chiffre"><b>${d.n}</b><span>Écrans ouverts</span></div>
          <div class="chiffre"><b>${d.comptes.length}</b><span>Comptes</span></div>
          <div class="chiffre"><b>${d.parties.length}</b><span>Parties</span></div>
        </div>
        <ul class="lignes" style="margin-top:8px">${d.comptes.length ? d.comptes.map(c => `
          <li><i class="rond en-ligne"></i><span class="nom">${echapper(c.nom)}<small>${c.jeu ? 'joue à ' + echapper(titreJeu(c.jeu)) : 'sur le site'}${c.invisible ? ' · invisible' : ''}</small></span></li>`).join('')
          : '<li class="vide">Aucun compte connecté</li>'}</ul>
        ${d.parties.length ? `<h2>Parties ouvertes</h2><ul class="lignes">${d.parties.map(p => `
          <li><span class="nom">${echapper(p.jeu === 'cercle' ? 'Le Cercle' : titreJeu(p.jeu))} · ${echapper(p.code)}<small>hôte ${echapper(p.hote)} · ${p.n}/${p.max} · ${p.phase === 'jeu' ? 'en cours' : 'dans le salon'}</small></span>
            <button class="btn petit rouge" data-fermer="${echapper(p.jeu)}/${echapper(p.code)}">Fermer</button></li>`).join('')}</ul>` : ''}`;
      boite.querySelectorAll('[data-fermer]').forEach(b => b.addEventListener('click', async () => {
        const [jeu, code] = b.dataset.fermer.split('/');
        if (!confirm(`Fermer la partie ${code} ? Tout le monde sera renvoyé à l’accueil du jeu.`)) return;
        b.disabled = true;
        const r = await C.api('admin-fermer', { jeu, code });
        if (r.erreur) { b.disabled = false; alert(r.erreur); return; }
        chargerSite();
      }));
    }

    let comptesAdmin = [];
    async function chargerComptes() {
      const d = await C.api('admin-liste');

      const ul = $('#admin-comptes');
      if (!ul) return;

      const options = JEUX.filter(j => j.multi).map(j => `<option value="${echapper(j.id)}">${echapper(j.titre)}</option>`).join('');
      ul.innerHTML = liste.length ? liste.map(c => `
        <li class="compte-admin">
          <details>
            <summary>${AV ? AV.svg(c.avatar || 'vert', 30, c.nom) : ''}<span class="nom" style="margin-left:8px">${echapper(c.nom)}${c.bloque ? ' <span class="badge-rouge">bloqué</span>' : ''}${c.banni ? ` <span class="badge-rouge">banni${c.banni > Date.now() + 50 * 365 * 86400000 ? '' : ' jusqu’au ' + new Date(c.banni).toLocaleDateString('fr-FR')}</span>` : ''}<small>niv. ${c.niveau} · vu ${ilYa(c.vu)} · créé le ${date(c.cree)} · ${c.victoires} V / ${c.parties} parties</small></span></summary>
            <div class="actions-admin" data-nom="${echapper(c.nom)}">
              <a class="btn petit" href="#profil/${encodeURIComponent(c.nom)}">Voir le profil</a>
              <form class="ligne" data-form="victoires">
                <select name="jeu" aria-label="Jeu">${options}</select>
                <input type="text" name="victoires" inputmode="numeric" placeholder="Victoires" aria-label="Victoires">
                <input type="text" name="parties" inputmode="numeric" placeholder="Parties" aria-label="Parties">
                <button class="btn petit" type="submit">OK</button>
              </form>
              ${c.cle !== 'pipou_dinosaur' ? `<form class="ligne" data-form="mdp">
                <input type="text" name="nouveau" placeholder="Nouveau mot de passe" autocomplete="off" aria-label="Nouveau mot de passe">
                <button class="btn petit" type="submit">Changer</button>
              </form>
              <div class="ligne">
                <select data-duree aria-label="Durée du bannissement"><option value="1">1 heure</option><option value="24">1 jour</option><option value="168">1 semaine</option><option value="720">1 mois</option><option value="-1">Pour toujours</option></select>
                ${c.banni ? '<button class="btn petit" data-ban="0">Débannir</button>' : '<button class="btn petit rouge" data-ban="1">Bannir</button>'}
              </div>
              <button class="btn petit rouge" data-supprimer>Supprimer ce compte</button>` : ''}
            </div>
          </details>
        </li>`).join('') : '<li class="vide">Aucun compte</li>';

      ul.querySelectorAll('[data-form="victoires"]').forEach(f => f.addEventListener('submit', async e => {
        e.preventDefault();
        const nom = f.closest('[data-nom]').dataset.nom;
        const v = f.victoires.value.trim(), p = f.parties.value.trim();
        const r = await C.api('admin-victoires', { nom, jeu: f.jeu.value, victoires: v || 0, parties: p || v || 0 });
        if (r.erreur) return message($('#msg-comptes'), r.erreur);
        message($('#msg-comptes'), `Victoires de ${nom} en ${titreJeu(f.jeu.value)} : ${v || 0}.`, true);

        const r = await C.api('admin-mdp', { nom, nouveau: f.nouveau.value });
        if (r.erreur) return message($('#msg-comptes'), r.erreur);
        f.reset();
        message($('#msg-comptes'), `Mot de passe de ${nom} changé (et compte débloqué). Il/elle a été déconnecté(e) partout.`, true);
        chargerComptes();
      }));
      ul.querySelectorAll('[data-ban]').forEach(b => b.addEventListener('click', async () => {
        const boite = b.closest('[data-nom]');
        const nom = boite.dataset.nom;
        const heures = b.dataset.ban === '0' ? 0 : Number(boite.querySelector('[data-duree]').value);
        if (heures && !confirm(`Bannir ${nom} ? Il/elle sera déconnecté(e) partout et ne pourra plus se connecter ni écrire dans le chat.`)) return;
        const r = await C.api('admin-ban', { nom, heures });
        if (r.erreur) return message($('#msg-comptes'), r.erreur);
        message($('#msg-comptes'), heures ? `${nom} est banni(e).` : `${nom} n’est plus banni(e).`, true);
        chargerComptes();
      }));
      ul.querySelectorAll('[data-supprimer]').forEach(b => b.addEventListener('click', async () => {
        const nom = b.closest('[data-nom]').dataset.nom;
        if (!confirm(`Supprimer le compte « ${nom} » pour toujours ? Ses victoires et ses amis seront effacés.`)) return;
        const r = await C.api('admin-supprimer', { nom });
        if (r.erreur) return message($('#msg-comptes'), r.erreur);
        message($('#msg-comptes'), `Compte ${nom} supprimé.`, true);
        chargerComptes();
      }));
    }

    /* ---------- Profil d'un autre joueur (#profil/Nom) ---------- */

    async function afficherProfilPublic(nom) {
      carte.innerHTML = '<p class="sous">Chargement…</p>';
      const d = await C.api('profil', { nom });
      if (lireProfil() !== nom) return;
      if (d.erreur) {
        carte.innerHTML = `<p class="message ko">${echapper(d.erreur)}</p><button class="btn grand" id="retour">← Retour</button>`;
      } else {
        const ami = C.amis.find(a => a.nom.toLowerCase() === d.profil.nom.toLowerCase());
        const moi = C.connecte && C.compte.nom.toLowerCase() === d.profil.nom.toLowerCase();
        carte.innerHTML = `
          <span class="pastille">Profil joueur</span>
          <div class="ligne-entete">${AV ? AV.svg(d.profil.avatar, 64, d.profil.nom) : ''}<div style="min-width:0;flex:1"><h1>${echapper(d.profil.nom)}</h1><p class="sous" style="margin:0">Membre depuis le ${date(d.profil.cree)}</p></div></div>
          ${htmlNiveau(d.profil)}
          ${htmlStats(d.stats || [])}
          ${D && d.succes && d.succes.length ? `<h2>Succès (${d.succes.length})</h2><div class="petits-succes">${d.succes.map(x => { const s = D.SUCCES.find(y => y.id === x.id); return s ? `<span title="${echapper(s.nom + ' : ' + s.desc)}">${s.icone}</span>` : ''; }).join('')}</div>` : ''}
          ${C.connecte && !moi ? (ami ? `<p class="aide" style="margin-top:14px">${ami.statut === 'ami' ? '✓ Vous êtes amis' : ami.statut === 'envoyee' ? 'Demande d’ami envoyée' : 'Il/elle veut être ton ami (va dans Amis)'}</p>`
            : '<button class="btn primaire grand" id="ajouter">Ajouter en ami</button><p class="message" id="msg-profil" hidden></p>') : ''}
          <button class="btn grand" id="retour">← Mon compte</button>`;
        const ajouter = $('#ajouter');
        if (ajouter) ajouter.addEventListener('click', async () => {
          const r = await C.ami('ami-demande', d.profil.nom);
          if (r.erreur) return message($('#msg-profil'), r.erreur);
          afficherProfilPublic(nom);
        });
      }
      $('#retour').addEventListener('click', () => { history.replaceState(null, '', location.pathname + location.search); afficher(); });
    }

    // liens directs : #creer, #connexion, #amis
    function lireAncre() {
      const h = location.hash.slice(1);
      if (h === 'creer' || h === 'connexion') onglet = h;
      if (['amis', 'reglages', 'admin', 'succes', 'profil'].includes(h)) ongletCompte = h;
      if (['creer', 'connexion', 'amis', 'reglages', 'admin', 'succes', 'profil'].includes(h)) history.replaceState(null, '', location.pathname + location.search);
    }
    lireAncre();
    window.addEventListener('hashchange', () => { lireAncre(); });
    demarrer();
  })();
  </script>
</body>
</html>
