<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  {% assign description = page.resume | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 %}
  <meta name="description" content="{{ description | escape }}">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/article.css' | relative_url }}">
</head>
<body>
  <header class="entete">
    <a class="marque" href="{{ '/' | relative_url }}"><img src="{{ '/assets/favicon.svg' | relative_url }}" width="28" height="28" alt=""><span>{{ site.title }}</span></a>
    <nav>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/#jeux' | relative_url }}">Jeux</a>
      <a href="{{ '/#apropos' | relative_url }}">À propos</a>
    </nav>
  </header>
  <main class="page">
    {{ content }}
  </main>
  <footer class="pied">© {{ site.time | date: '%Y' }} {{ site.title }} · <a href="{{ '/' | relative_url }}">Retour au site</a></footer>
</body>
</html>
