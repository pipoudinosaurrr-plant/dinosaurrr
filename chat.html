<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Chat</title>
  <link rel="stylesheet" href="games/jeu.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: #070707; -webkit-user-select: text; user-select: text; }
    header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--bord); background: #0c0c0c; }
    header b { font-size: 15px; }
    header small { color: var(--tres-doux); font: 500 11px var(--mono); }
    header .espace { flex: 1; }
    #messages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
    .msg { display: flex; gap: 9px; align-items: flex-start; }
    .msg .avatar-dino { flex: none; margin-top: 2px; }
    .bulle { min-width: 0; max-width: 100%; padding: 7px 11px 8px; border: 1px solid var(--bord); border-radius: 4px 14px 14px 14px; background: rgba(255, 255, 255, .03); }
    .bulle .qui { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; }
    .bulle .qui b { color: #e5e5e5; }
    .bulle .qui .admin { color: #fde047; }
    .bulle .qui small { color: var(--tres-doux); font: 500 10.5px var(--mono); }
    .bulle p { margin: 2px 0 0; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
    .msg.moi { flex-direction: row-reverse; }
    .msg.moi .bulle { border-radius: 14px 4px 14px 14px; background: rgba(34, 197, 94, .1); border-color: rgba(34, 197, 94, .3); }
    .msg.mention .bulle { border-color: rgba(250, 204, 21, .6); }
    .suppr { flex: none; align-self: center; border: 0; background: none; color: var(--tres-doux); cursor: pointer; font-size: 13px; opacity: .6; }
    .suppr:hover { color: #f87171; opacity: 1; }
    .vide { margin: auto; color: var(--tres-doux); font-size: 13px; text-align: center; }
    form { display: flex; gap: 8px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--bord); background: #0c0c0c; }
    form input { flex: 1; min-width: 0; height: 42px; padding: 0 13px; border: 1px solid var(--bord2); border-radius: 10px; background: rgba(255, 255, 255, .03); color: #fafafa; font: 15px inherit; font-family: inherit; outline: none; }
    form input:focus { border-color: var(--bord3); }
    form .btn { height: 42px; }
    .connexion { padding: 12px; border-top: 1px solid var(--bord); text-align: center; color: var(--doux); font-size: 13.5px; }
    .connexion a { color: var(--accent); }
    .info { padding: 6px 12px; color: #fca5a5; font-size: 12.5px; }
    .info[hidden], [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><span style="font-size:20px">💬</span><div><b>Chat du site</b><br><small id="etat">Connexion…</small></div><span class="espace"></span><button class="btn petit rouge" id="vider" hidden>Vider le chat</button></header>
  <div id="messages"><p class="vide">Chargement…</p></div>
  <p class="info" id="info" hidden></p>
  <form id="form" hidden autocomplete="off"><input id="texte" maxlength="200" placeholder="Écris un message…" enterkeyhint="send"><button class="btn primaire" type="submit">Envoyer</button></form>
  <div class="connexion" id="connexion" hidden>Il faut un compte pour écrire dans le chat. <a href="compte.html#connexion">Se connecter</a> · <a href="compte.html#creer">Créer un compte</a></div>

  <script src="assets/config.js"></script>
  <script>
  (async function () {
    const $ = id => document.getElementById(id);
    const echapper = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const parent = nom => { try { return window.parent !== window ? window.parent[nom] : null; } catch (e) { return null; } };
    const charger = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = r; document.head.append(s); });
    let C = parent('DinoCompte'); if (!C) { await charger('assets/compte.js'); C = window.DinoCompte; }
    let P = parent('DinoPresence'); if (!P) { await charger('assets/presence.js'); P = window.DinoPresence; }
    let AV = parent('DinoAvatar'); if (!AV) { await charger('assets/avatars.js'); AV = window.DinoAvatar; }

    let messages = [], ouvert = false;
    const heure = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const moi = () => (C && C.compte ? C.compte.nom : '');
    const admin = () => !!(C && C.compte && C.compte.admin);

    function dessiner(bas) {
      const zone = $('messages');
      const enBas = zone.scrollHeight - zone.scrollTop - zone.clientHeight < 60;
      const m = moi();
      zone.innerHTML = messages.length ? messages.map(x => {
        const mention = m && x.de !== m && x.texte.toLowerCase().includes(m.toLowerCase());
        return `<div class="msg ${x.de === m ? 'moi' : ''} ${mention ? 'mention' : ''}">
          ${AV ? AV.svg(x.avatar || 'vert', 32) : ''}
          <div class="bulle"><div class="qui"><b class="${x.admin ? 'admin' : ''}">${x.admin ? '⚡ ' : ''}${echapper(x.de)}</b><small>niv. ${x.niveau || 1} · ${heure(x.t)}</small></div><p>${echapper(x.texte)}</p></div>
          ${admin() ? `<button class="suppr" data-suppr="${echapper(x.id)}" title="Supprimer ce message">🗑</button>` : ''}
        </div>`;
      }).join('') : '<p class="vide">Pas encore de message. Lance la discussion !</p>';
      if (bas || enBas) zone.scrollTop = zone.scrollHeight;
    }

    function majCompte() {
      const co = !!(C && C.connecte);
      $('form').hidden = !co;
      $('connexion').hidden = co;
      $('vider').hidden = !admin();
      dessiner(false);
    }

    function ouvrir() {
      if (P && P.envoyer({ t: 'chat-ouvrir' })) ouvert = true;
    }
    const arrets = [];
    window.addEventListener('pagehide', () => arrets.forEach(f => f()), { once: true });
    if (P) arrets.push(P.ecouter(m => {
      if (m.t === 'compte') {
        $('etat').textContent = m.n === null ? 'Hors ligne' : (m.n <= 1 ? 'Toi seul sur le site' : `${m.n} personnes sur le site`);
        if (!ouvert && m.n !== null) ouvrir();
        if (m.n === null) ouvert = false;
      }
      if (m.t === 'chat-historique') { messages = m.liste || []; dessiner(true); }
      if (m.t === 'chat') { messages.push(m.m); if (messages.length > 80) messages.shift(); dessiner(m.m.de === moi()); }
      if (m.t === 'chat-supprime') { messages = messages.filter(x => x.id !== m.id); dessiner(false); }
      if (m.t === 'chat-refuse') { $('info').textContent = m.raison; $('info').hidden = false; setTimeout(() => { $('info').hidden = true; }, 3500); }
      if (m.t === 'banni') { $('info').textContent = 'Ton compte a été banni par l’admin.'; $('info').hidden = false; }
    }));
    if (C) arrets.push(C.ecouter(majCompte));
    if (!P || !P.actif) $('etat').textContent = 'Le serveur n’est pas branché';
    ouvrir();

    $('form').addEventListener('submit', e => {
      e.preventDefault();
      const texte = $('texte').value.trim();
      if (!texte) return;
      if (!P || !P.envoyer({ t: 'chat', texte })) { $('info').textContent = 'Pas connecté au serveur, réessaie dans un instant.'; $('info').hidden = false; return; }
      $('texte').value = '';
    });
    $('messages').addEventListener('click', e => {
      const b = e.target.closest('[data-suppr]');
      if (b && admin()) P.envoyer({ t: 'chat-supprimer', id: b.dataset.suppr });
    });
    $('vider').addEventListener('click', () => { if (confirm('Effacer tous les messages du chat ?')) P.envoyer({ t: 'chat-vider' }); });
    // la page du site sait que le chat est lu
    const lu = parent('DinoChatLu'); if (lu) lu();
  })();
  </script>
</body>
</html>
