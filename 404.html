<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: radial-gradient(700px 400px at 50% 0%, rgba(34, 197, 94, .1), transparent 60%), #000;
      color: #ededed;
      font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    .code { color: #6b6b6b; font: 13px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 7vw, 44px); line-height: 1.1; letter-spacing: -.04em; }
    p { margin: 0 0 26px; color: #a1a1a1; }
    a { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 10px; background: #fafafa; color: #000; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERREUR 404</div>
    <h1>Cette page n'existe pas.</h1>
    <p>Elle a peut-être été déplacée, ou l'adresse contient une faute de frappe.</p>
    <a href="/">Retour au site</a>
  </main>
</body>
</html>
